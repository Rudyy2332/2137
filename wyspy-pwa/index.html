// ---------- Postać (styl Terrarii, z założoną zbroją) ----------
function rysujGracza() {
  const { x, y, kierunek, krok } = gracz;
  const bob = Math.round(Math.abs(Math.sin(krok)) * 1.5);
  const faza = Math.sin(krok);
  const lUnos = faza > 0.4 ? 1 : 0, rUnos = faza < -0.4 ? 1 : 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(0, 9, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.scale(kierunek, 1);
  ctx.translate(0, -bob);
  const R = (ux, uy, uw, uh, c) => { ctx.fillStyle = c; ctx.fillRect(ux * 2, uy * 2, uw * 2, uh * 2); };

  const skin = "#f0b98c", skinD = "#d99a6c", hair = "#6b3f1d", hairL = "#8a5a2b";
  const hel = equip[0], chest = equip[1], leg = equip[2];
  const cH = hel ? kolorGear(hel.id) : null, cC = chest ? kolorGear(chest.id) : null, cL = leg ? kolorGear(leg.id) : null;
  const koszula = cC ? cC.kol : "#c8342f", koszulaD = cC ? shade(cC.kol, 0.6) : "#9a2420", koszulaL = cC ? cC.jas : "#e0524a";
  const spod = cL ? cL.kol : "#3b4aa8", spodD = cL ? shade(cL.kol, 0.6) : "#2b3680";
  const but = cL ? shade(cL.kol, 0.5) : "#5d4037";

  // tylne ramię
  R(-3, -3, 1, 3, koszulaD);
  R(-3, 0, 1, 1, skinD);
  // nogi
  const lLen = 3 - lUnos, rLen = 3 - rUnos;
  R(-2, 1, 2, lLen - 1, spod); R(-2, lLen, 2, 1, but);
  R(0, 1, 2, rLen - 1, spodD); R(0, rLen, 2, 1, but);
  if (cL) { R(-2, 1, 2, 1, cL.jas); R(0, 1, 2, 1, cL.jas); }
  // tułów
  R(-2, -3, 4, 3, koszula);
  R(-2, 0, 4, 1, koszulaD);
  R(-2, -3, 4, 1, koszulaL);
  if (cC) { R(-1, -2, 1, 2, cC.jas); }
  // przednie ramię
  R(2, -3, 1, 3, koszula);
  R(2, 0, 1, 1, skin);
  // głowa
  R(-3, -8, 6, 5, skin);
  R(-3, -8, 6, 2, hair);
  R(-3, -6, 1, 2, hair);
  R(-2, -8, 2, 1, hairL);
  R(1, -7, 2, 1, hair);
  R(0, -5, 1, 1, "#ffffff");
  R(1, -5, 1, 1, "#2a3a8a");
  R(1, -3, 1, 0.5, skinD);
  // hełm
  if (hel) {
    R(-2, -9, 4, 1, cH.jas);
    R(-3, -8, 6, 2, cH.kol);
    R(-3, -6, 1, 2, shade(cH.kol, 0.7));
    R(-2, -8, 3, 1, cH.jas);
    R(-3, -7, 6, 1, shade(cH.kol, 0.75));
    R(0, -6, 3, 1, "#1a1d24");
  }

  // trzymany przedmiot
  const hi = inv[sel];
  const typH = hi ? ITEMY[hi.id].typ : null;
  if (typH === "siekiera" || typH === "kilof" || KLASA[typH]) {
    let kat = -0.55;
    if (gracz.swing > 0) {
      const pp = 1 - gracz.swing / 0.25;
      kat = -1.3 + pp * 2.0;
    }
    ctx.save();
    ctx.translate(5, -3);
    ctx.rotate(kat);
    ctx.imageSmoothingEnabled = false;
    const hs = sprite(hi.id), hk = 28 / Math.max(hs.width, hs.height), hw = hs.width * hk, hh = hs.height * hk;
    if (hs && hs.width && hs.height) ctx.drawImage(hs, -2, 2 - hh, hw, hh);
    ctx.restore();
  }

  ctx.restore();
}

function rysujPochodnie(vx0, vy0, vx1, vy1) {
  pochodnie.forEach(([tx, ty], i) => {
    const cx = tx * T + T / 2, cy = ty * T + T / 2;
    if (cx < vx0 || cx > vx1 || cy < vy0 || cy > vy1) return;
    const mig = 0.8 + Math.sin(czas * 12 + i * 2) * 0.2;
    ctx.fillStyle = "rgba(255,170,60," + (0.18 * mig) + ")";
    ctx.beginPath(); ctx.arc(cx, cy - 4, 26 * mig, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(TORCH_SPR, cx - 8, cy - 14, 16, 28);
  });
}

function rysujDach() {
  if (lvl.id !== "glowna" || dachAlfa < 0.02) return;
  const x = (CX0 + 1) * T, y = (CY0 + 1) * T;
  const w = (CW - 2) * T, h = (CH - 2) * T;
  ctx.save();
  ctx.globalAlpha = dachAlfa;
  ctx.fillStyle = "#7b3f3f";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#5c2c2c";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let yy = y; yy <= y + h; yy += 16) { ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); }
  ctx.stroke();
  ctx.fillStyle = "#933f3f";
  ctx.fillRect(x, y + h / 2 - 6, w, 12);
  ctx.restore();
}

function rysujWieze() {
  if (lvl.id !== "glowna") return;
  wieze.forEach(w => {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.arc(w.x + 3, w.y + 5, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a8a96";
    ctx.beginPath(); ctx.arc(w.x, w.y, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a02c2c";
    ctx.beginPath(); ctx.arc(w.x, w.y, 36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c13b3b";
    ctx.beginPath(); ctx.arc(w.x - 6, w.y - 6, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4e342e";
    ctx.fillRect(w.x - 1, w.y - 26, 2, 26);
    const fal = Math.sin(czas * 5 + w.x) * 2;
    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.moveTo(w.x + 1, w.y - 26);
    ctx.lineTo(w.x + 15, w.y - 22 + fal);
    ctx.lineTo(w.x + 1, w.y - 17);
    ctx.fill();
  });
}

// ---------- Ciemność w jaskiniach ----------
function swiatlo(sx, sy, r, sila) {
  const g = dctx.createRadialGradient(sx, sy, r * 0.15, sx, sy, r);
  g.addColorStop(0, "rgba(0,0,0," + sila + ")");
  g.addColorStop(1, "rgba(0,0,0,0)");
  dctx.fillStyle = g;
  dctx.fillRect(sx - r, sy - r, r * 2, r * 2);
}
function rysujCiemnosc() {
  if (ciemnosc < 0.02) return;
  const z = kamera.zoom;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = "source-over";
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = "rgba(2,2,8,0.94)";
  dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = "destination-out";

  swiatlo((gracz.x - kamera.x) * z + W / 2, (gracz.y - 4 - kamera.y) * z + H / 2, Math.max(120, 110 * z), 1);
  pochodnie.forEach(([tx, ty], i) => {
    const sx = (tx * T + T / 2 - kamera.x) * z + W / 2;
    const sy = (ty * T + T / 2 - 2 - kamera.y) * z + H / 2;
    const r = (75 + Math.sin(czas * 9 + i) * 5) * z;
    if (sx < -r || sx > W + r || sy < -r || sy > H + r) return;
    swiatlo(sx, sy, r, 0.92);
  });

  dctx.globalCompositeOperation = "source-over";
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = Math.min(1, ciemnosc);
  if (dark.width && dark.height) ctx.drawImage(dark, 0, 0);
  ctx.globalAlpha = 1;
}

function rysuj() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = lvl.typ === "swiat" ? "#1d4f7a" : "#0b0a09";
  ctx.fillRect(0, 0, W, H);

  ctx.setTransform(
    kamera.zoom, 0, 0, kamera.zoom,
    W / 2 - kamera.x * kamera.zoom,
    H / 2 - kamera.y * kamera.zoom
  );

  const vx0 = kamera.x - W / 2 / kamera.zoom - 40, vx1 = kamera.x + W / 2 / kamera.zoom + 40;
  const vy0 = kamera.y - H / 2 / kamera.zoom - 40, vy1 = kamera.y + H / 2 / kamera.zoom + 40;
  const x0 = Math.max(0, Math.floor((kamera.x - W / 2 / kamera.zoom) / T));
  const y0 = Math.max(0, Math.floor((kamera.y - H / 2 / kamera.zoom) / T));
  const x1 = Math.min(MAP_W - 1, Math.floor((kamera.x + W / 2 / kamera.zoom) / T));
  const y1 = Math.min(MAP_H - 1, Math.floor((kamera.y + H / 2 / kamera.zoom) / T));

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      rysujKafelek(tx, ty);
    }
  }

  rysujPochodnie(vx0, vy0, vx1, vy1);

  if (lvl.typ === "swiat") {
    rysujStatekModel(lvl.dok.x, lvl.dok.y - 8);
    podpis("Port", lvl.dok.x, lvl.dok.y - 62);
    JASKINIE_DEF.filter(d => d.isl === lvl.id).forEach(d => podpis(d.nazwa, (d.wx + 2) * T, d.wy * T - 6));
  } else {
    const ex = Math.floor(lvl.w / 2);
    podpis(lvl.exitLabel, ex * T, (lvl.h - 3) * T - 6);
    if (lvl.stairs) podpis("Niżej", lvl.stairs.x, lvl.stairs.ty * T - 6);
  }

  if (gracz.cel) {
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(gracz.cel.x, gracz.cel.y, 6, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (gracz.obiekt && gracz.obiekt.hp > 0) {
    const t = gracz.obiekt;
    ctx.strokeStyle = "rgba(255,235,59,0.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(t.tx * T + T / 2, (t.ty + 1) * T - 2, 15, 6, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  const widoczne = [];
  for (let ty = Math.max(0, y0 - 1); ty <= Math.min(MAP_H - 1, y1 + 3); ty++) {
    for (let tx = Math.max(0, x0 - 2); tx <= Math.min(MAP_W - 1, x1 + 2); tx++) {
      const di = drzewaGrid[idx(tx, ty)];
      if (di) widoczne.push(drzewa[di - 1]);
      const ri = rudyGrid[idx(tx, ty)];
      if (ri) widoczne.push(rudy[ri - 1]);
    }
  }
  widoczne.sort((a, b) => a.ty - b.ty);

  const stopy = gracz.y + 9;
  const przed = [], po = [];
  widoczne.forEach(t => ((t.ty + 1) * T - 2 <= stopy ? przed : po).push(t));

  przed.forEach(rysujObiekt);
  przedmioty.filter(o => (o.ty + o.h) * T <= stopy).forEach(rysujPrzedmiot);
  rysujGracza();
  if (lvl.boss && !lvl.boss.dead) rysujBossa(lvl.boss);
  rysujPociski();
  przedmioty.filter(o => (o.ty + o.h) * T > stopy).forEach(rysujPrzedmiot);
  po.forEach(rysujObiekt);

  czastki.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, 2.5, 2.5);
  });
  ctx.globalAlpha = 1;

  teksty.forEach(t => {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.5));
    ctx.font = "bold 9px Arial";
    ctx.textAlign = "center";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.8)";
    ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = "#fff";
    ctx.fillText(t.txt, t.x, t.y);
  });
  ctx.globalAlpha = 1;

  rysujDach();
  rysujWieze();
  rysujCiemnosc();

  if (fade > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "rgba(0,0,0," + fade + ")";
    ctx.fillRect(0, 0, W, H);
  }

  rysujUI();
  rysujBossUI();
  rysujKonsole();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
  ctx.fillText('Autozapis co 5 s · Shift+Delete – nowa gra · ~ konsola', 14, 208);
}

// ---------- Konsola (klawisz ~) ----------
const konsola = { otwarta: false, wiersz: "", log: [], hist: [], hi: -1 };
let godMode = false, nieskMonety = false;
const bezAkc = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l");
function kLog(t, c) { konsola.log.push({ t, c: c || "#ddd" }); if (konsola.log.length > 60) konsola.log.shift(); }
function znajdzItem(q) {
  q = bezAkc(q.trim());
  if (!q) return null;
  if (ITEMY[q]) return [q];
  const ids = Object.keys(ITEMY);
  const dok = ids.filter(id => bezAkc(ITEMY[id].nazwa) === q);
  if (dok.length) return dok;
  return ids.filter(id => id.indexOf(q) >= 0 || bezAkc(ITEMY[id].nazwa).indexOf(q) >= 0);
}
function dajItem(id, n) {
  const z = dodaj(id, n);
  return n - z;
}
const KOMENDY = {
  help() {
    kLog("Komendy:", "#8cf");
    kLog("  give <id/nazwa> [ile]  – dodaje przedmiot (np. give sztabka_zelazo 20)");
    kLog("  items [filtr]          – lista id przedmiotów");
    kLog("  set <ruda>             – cały komplet: zbroja, kilof, siekiera, miecz (np. set tytan)");
    kLog("  monety                 – nieskończone monety włącz/wyłącz");
    kLog("  god                    – nieśmiertelność włącz/wyłącz");
    kLog("  heal                   – pełne zdrowie");
    kLog("  unlock                 – odblokuj wszystkie wyspy");
    kLog("  tp <glowna|w1|w2|w3|w4> – teleport na wyspę");
    kLog("  boss                   – zabij bossa na tym poziomie");
    kLog("  speed <liczba>         – prędkość gracza (domyślnie 160)");
    kLog("  clear                  – wyczyść ekwipunek    cls – wyczyść konsolę");
  },
  items(a) {
    const f = bezAkc(a.join(" "));
    const ids = Object.keys(ITEMY).filter(id => !f || id.indexOf(f) >= 0 || bezAkc(ITEMY[id].nazwa).indexOf(f) >= 0);
    kLog(ids.length + " przedmiotów" + (ids.length > 40 ? " (pokazuję 40, zawęź filtr)" : "") + ":", "#8cf");
    ids.slice(0, 40).forEach(id => kLog("  " + id + " – " + ITEMY[id].nazwa));
  },
  give(a) {
    if (!a.length) { kLog("give <id/nazwa> [ile]", "#fa6"); return; }
    let n = 1;
    if (a.length > 1 && /^\d+$/.test(a[a.length - 1])) n = Math.min(9999, parseInt(a.pop()));
    const r = znajdzItem(a.join(" "));
    if (!r || !r.length) { kLog("Nie znaleziono przedmiotu: " + a.join(" "), "#f66"); return; }
    if (r.length > 1) { kLog("Pasuje kilka (" + r.length + "), wpisz dokładne id:", "#fa6"); r.slice(0, 12).forEach(id => kLog("  " + id + " – " + ITEMY[id].nazwa)); return; }
    const d = dajItem(r[0], n);
    kLog("Dodano " + d + "× " + ITEMY[r[0]].nazwa + (d < n ? " (ekwipunek pełny)" : ""), "#8f8");
  },
  set(a) {
    const k = bezAkc(a[0] || "");
    if (TIERY.indexOf(k) < 0) { kLog("set <" + TIERY.join("|") + ">", "#fa6"); return; }
    ["helm", "napiersnik", "nogawice", "kilof", "siekiera", "miecz", "krotki", "luk", "wlocznia"].forEach(t => dodaj(t + "_" + k, 1));
    kLog("Dodano komplet: " + k, "#8f8");
  },
  monety() { nieskMonety = !nieskMonety; kLog("Nieskończone monety: " + (nieskMonety ? "WŁĄCZONE" : "wyłączone"), nieskMonety ? "#8f8" : "#fa6"); },
  god() { godMode = !godMode; kLog("Nieśmiertelność: " + (godMode ? "WŁĄCZONA" : "wyłączona"), godMode ? "#8f8" : "#fa6"); },
  heal() { gracz.hp = gracz.maxhp; kLog("Zdrowie odnowione", "#8f8"); },
  unlock() { WYSPY_DEF.forEach(w => { odblokowane[w.id] = true; }); kLog("Odblokowano wszystkie wyspy", "#8f8"); },
  tp(a) {
    const L = POZIOMY[a[0] || ""];
    if (!L) { kLog("tp <glowna|w1|w2|w3|w4>", "#fa6"); return; }
    const p = L.spawn || (a[0] === "glowna" ? { x: 60 * T, y: (CY0 + CH + 5) * T } : L.dok);
    wejdzDo(L, p.x, p.y);
    kLog("Teleport: " + L.nazwa, "#8f8");
  },
  boss() {
    const b = lvl.boss;
    if (!b || b.dead) { kLog("Brak żywego bossa na tym poziomie", "#fa6"); return; }
    pokonajBossa(b);
  },
  speed(a) { const v = parseFloat(a[0]); if (!(v > 0 && v <= 1000)) { kLog("speed <liczba>, domyślnie 160", "#fa6"); return; } gracz.v = v; kLog("Prędkość: " + v, "#8f8"); },
  clear() { for (let i = 0; i < SLOTY; i++) inv[i] = null; kLog("Ekwipunek wyczyszczony", "#8f8"); },
  cls() { konsola.log.length = 0; }
};
function wykonajKomende(txt) {
  txt = txt.trim().replace(/^\//, "");
  if (!txt) return;
  kLog("> " + txt, "#fff");
  const cz = txt.split(/\s+/), nazwa = bezAkc(cz[0]);
  const alias = { monety: "monety", coins: "monety", money: "monety", pomoc: "help", "?": "help", dodaj: "give", przedmioty: "items" };
  const k = alias[nazwa] || nazwa;
  if (KOMENDY[k]) { try { KOMENDY[k](cz.slice(1)); } catch (e) { kLog("Błąd: " + e.message, "#f66"); } }
  else kLog("Nieznana komenda. Wpisz help", "#f66");
}
