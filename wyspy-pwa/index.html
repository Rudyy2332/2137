const T = 32;

const TOUCH = /[?&]touch=1/.test(location.search) || (window.matchMedia && matchMedia("(pointer: coarse)").matches) || "ontouchstart" in window;
let US = 1, pomocOtw = false;
function liczUS() { return TOUCH ? Math.max(0.5, Math.min(1, innerHeight / 460, innerWidth / 720)) : 1; }
const VW = () => Math.max(1, Math.round(innerWidth / US)), VH = () => Math.max(1, Math.round(innerHeight / US));
function zmianaRozmiaru() { US = liczUS(); return VW() !== W || VH() !== H; }
let W, H;
function resize() {
  US = liczUS();
  W = canvas.width = VW();
  H = canvas.height = VH();
  dark.width = W; dark.height = H;
}
window.addEventListener("resize", resize);
resize();

function hash(x, y, s = 0) {
  let h = x * 374761393 + y * 668265263 + s * 1442695041;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Narzędzia do pixel-artu ----------
function mkc(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function hexRgb(h) { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function shade(hex, f) {
  const [r, g, b] = hexRgb(hex);
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  return "rgb(" + cl(r * f) + "," + cl(g * f) + "," + cl(b * f) + ")";
}
function obrys(c, col) {
  const g = c.getContext("2d"), w = c.width, h = c.height;
  const a = g.getImageData(0, 0, w, h).data;
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 0;
  const out = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (op(x, y)) continue;
    if (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1)) out.push([x, y]);
  }
  g.fillStyle = col;
  out.forEach(([x, y]) => g.fillRect(x, y, 1, 1));
}
function mkSpr(w, h, fn, outline) {
  const c = mkc(w, h), g = c.getContext("2d");
  const P = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  fn(P, g);
  if (outline) obrys(c, outline);
  return c;
}
function strSpr(rows, pal) {
  return mkSpr(rows[0].length, rows.length, (P) => {
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const ch = r[x]; if (ch !== "." && pal[ch]) P(x, y, pal[ch]); } });
  });
}
const TC = {};
function TC_(key, fn) { return TC[key] || (TC[key] = fn()); }
function dt(c, x, y) { ctx.drawImage(c, x, y, T, T); }

function mkSzum(cols, seed, blok, kJ, kC, kr) {
  return mkSpr(16, 16, (P) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const r = hash(Math.floor(x / blok), Math.floor(y / blok), seed);
      P(x, y, cols[Math.min(cols.length - 1, Math.floor(r * cols.length))]);
    }
    if (kJ) for (let i = 0; i < 5; i++) P(Math.floor(hash(i, seed, 301) * 16), Math.floor(hash(i, seed, 302) * 16), kJ);
    if (kC) for (let i = 0; i < 5; i++) P(Math.floor(hash(i, seed, 303) * 16), Math.floor(hash(i, seed, 304) * 16), kC);
    if (kr) {
      for (let x = 0; x < 16; x++) { P(x, 0, "rgba(255,255,255,0.12)"); P(x, 15, "rgba(0,0,0,0.28)"); }
      for (let y = 0; y < 16; y++) { P(0, y, "rgba(255,255,255,0.08)"); P(15, y, "rgba(0,0,0,0.2)"); }
    }
  });
}
function tekstTrawa(pal, v) {
  return mkSpr(16, 16, (P) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) P(x, y, pal[Math.floor(hash(x, y, 100 + v) * 4)]);
    const jasny = shade(pal[2], 1.3), ciemny = shade(pal[3], 0.75);
    for (let i = 0; i < 6; i++) {
      const bx = Math.floor(hash(i, v, 201) * 14), by = 2 + Math.floor(hash(i, v, 202) * 13);
      P(bx, by, jasny); P(bx, by - 1, jasny); P(bx + 1, by, ciemny);
    }
  });
}
function tekstCegla(baza, v) {
  return mkSpr(16, 16, (P) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const row = Math.floor(y / 4), off = (row % 2) * 4;
      if (y % 4 === 3 || (x + off) % 8 === 7) { P(x, y, "#4a4a54"); continue; }
      const bi = Math.floor((x + off) / 8);
      const f = 0.9 + 0.2 * hash(bi, row, v + 40);
      P(x, y, y % 4 === 0 ? shade(baza, f * 1.15) : shade(baza, f));
    }
  });
}
function tekstDeski(v, ciemne) {
  const cols = ciemne ? ["#8a5e30", "#7f5529", "#946636"] : ["#a5733b", "#9a6a35", "#ad7a42"];
  const linia = ciemne ? "#4a2e14" : "#5e3d1c";
  return mkSpr(16, 16, (P) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const row = Math.floor(y / 4);
      if (y % 4 === 3) { P(x, y, linia); continue; }
      if (x === (row % 2 ? 5 : 11)) { P(x, y, linia); continue; }
      P(x, y, cols[Math.floor(hash(Math.floor(x / 3), y, v + 60) * 3)]);
    }
  });
}

  miecz: { m: 1, cd: 0.45, reach: 0 }, krotki: { m: 0.7, cd: 0.3, reach: -8 }, wlocznia: { m: 1.2, cd: 0.65, reach: 24 },

function kategoria(typ) {
  if (typ === "kilof" || typ === "siekiera") return "narz";
  if (KLASA[typ]) return "bron";

function kolorGear(id) {

}
function nazwaPrzedmiotu(it) { return ITEMY[it.id].nazwa + (it.buf ? " (" + it.buf.n + ")" : ""); }
function mocNarz(it) { return (1 + (ITEMY[it.id].tier + 1) * 0.25) * (it.buf ? it.buf.m : 1); }
function predkoscNarz(it) { return it && it.buf && it.buf.s ? it.buf.s : 1; }
function obrazenia(it) { const i = ITEMY[it.id]; return Math.round((8 + i.tier * 5) * (KLASA[i.typ] ? KLASA[i.typ].m : 1) * (it.buf ? it.buf.m : 1)); }
function obrona(it) {
  const i = ITEMY[it.id];
  const b = i.typ === "helm" ? 1 + i.tier * 0.6 : i.typ === "napiersnik" ? 2 + i.tier * 0.9 : 1 + i.tier * 0.7;
  return it.buf ? Math.ceil(b * it.buf.m) : Math.max(1, Math.round(b));
}
function statLinia(it) {
  const i = ITEMY[it.id];
  if (!i.typ) return "";
  if (i.typ === "kilof" || i.typ === "siekiera") {

  }

  return "Obrona: " + obrona(it) + (i.klasa ? " · " + KLASA_ZB[i.klasa].n : "");
}

// ---------- Poziomy ----------
function nowyPoziom(w, h, typ, nazwa) {
  return {
    w, h, typ, nazwa, id: "",
    cm: new Uint8Array(w * h), deko: new Uint8Array(w * h),
    drzewa: [], drzewaGrid: new Int32Array(w * h),
    rudy: [], rudyGrid: new Int32Array(w * h),
    przedmioty: [], pochodnie: [], wieze: [], portale: {}
  };
}

let lvl, cm, deko, drzewa, drzewaGrid, rudy, rudyGrid, przedmioty, pochodnie, wieze;
const idx = (tx, ty) => ty * MAP_W + tx;
function ustawPoziom(L) {
  lvl = L; MAP_W = L.w; MAP_H = L.h; WORLD_W = L.w * T; WORLD_H = L.h * T;
  cm = L.cm; deko = L.deko; drzewa = L.drzewa; drzewaGrid = L.drzewaGrid;
  rudy = L.rudy; rudyGrid = L.rudyGrid; przedmioty = L.przedmioty;
  pochodnie = L.pochodnie; wieze = L.wieze;
}

const POZIOMY = {};

function getCave(d, lev) {
  if (!d.lv[lev]) { d.lv[lev] = zbudujJaskinie(d, lev); d.lv[lev].ref = JASKINIE_DEF.indexOf(d) + ':' + lev; }
  return d.lv[lev];
}

function postawKopiec(L, d) {
  const I = (x, y) => y * L.w + x, c = L.cm;
  for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 4; dx++) c[I(d.wx + dx, d.wy + dy)] = 20;
  c[I(d.wx + 1, d.wy + 2)] = 22;
  c[I(d.wx + 2, d.wy + 2)] = 22;
  for (let dy = 3; dy < 7; dy++) [d.wx + 1, d.wx + 2].forEach(tx => c[I(tx, d.wy + dy)] = 7);
  L.pochodnie.push([d.wx, d.wy + 2], [d.wx + 3, d.wy + 2]);
  [d.wx + 1, d.wx + 2].forEach(tx => {
    L.portale[I(tx, d.wy + 2)] = { fn: () => { const J = getCave(d, 0); return { cel: J, x: J.start.x, y: J.start.y }; } };
  });
}
const bliskoKopca = (tx, ty, lista) => lista.some(d => tx >= d.wx - 3 && tx <= d.wx + 6 && ty >= d.wy - 3 && ty <= d.wy + 10);

function posadzDrzewa(L, wyklucz) {
  const I = (x, y) => y * L.w + x;
  for (let ty = 2; ty < L.h - 2; ty++) {
    for (let tx = 2; tx < L.w - 2; tx++) {
      if (L.cm[I(tx, ty)] || wyklucz(tx, ty)) continue;
      const gestosc = 0.025 + 0.11 * (0.5 + 0.5 * Math.sin(tx * 0.17 + 1) * Math.sin(ty * 0.13 + 2));
      if (hash(tx, ty, 30) < gestosc) {
        L.drzewa.push({ typ: "drzewo", tx, ty, hp: 5, maxhp: 5, shake: 0, bar: 0, respawn: 0, v: hash(tx, ty, 31) });
        L.drzewaGrid[I(tx, ty)] = L.drzewa.length;
      }
    }
  }
}

// ---------- Wyspa główna z zamkiem ----------
const CW = 16, CH = 12;
const CX0 = 52, CY0 = 54;
const GATE_X = [59, 60];

function zbudujSwiat() {
  const L = nowyPoziom(120, 120, "swiat", "Wyspa główna");
  L.id = "glowna";
  const I = (x, y) => y * L.w + x;
  const c = L.cm;

  for (let ty = CY0; ty < CY0 + CH; ty++) {
    for (let tx = CX0; tx < CX0 + CW; tx++) {
      const krawedz = tx === CX0 || tx === CX0 + CW - 1 || ty === CY0 || ty === CY0 + CH - 1;
      c[I(tx, ty)] = krawedz ? 1 : 2;
    }
  }
  GATE_X.forEach(tx => c[I(tx, CY0 + CH - 1)] = 3);

  [CX0, CX0 + CW - 3].forEach(ox => [CY0, CY0 + CH - 3].forEach(oy => {
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) c[I(ox + dx, oy + dy)] = 9;
    L.wieze.push({ x: (ox + 1.5) * T, y: (oy + 1.5) * T });
  }));

  for (let ty = CY0 + CH; ty < 112; ty++) GATE_X.forEach(tx => c[I(tx, ty)] = 7);
  for (let ty = 112; ty < 118; ty++) GATE_X.forEach(tx => c[I(tx, ty)] = 30);
  GATE_X.forEach(tx => { c[I(tx, 118)] = 31; L.portale[I(tx, 118)] = { statek: true }; });
  L.spawn = { x: 60 * T, y: 116 * T + 12 };
  L.dok = { x: 60 * T, y: 118 * T + 16 };
  L.pochodnie.push([58, 115], [61, 115]);

  L.przedmioty.push(
    { typ: "sklep",    nazwa: "Sklep",              tx: 55, ty: 57, w: 3, h: 2 },
    { typ: "piec",     nazwa: "Piec hutniczy",      tx: 63, ty: 57, w: 2, h: 2 },
    { typ: "kamien",   nazwa: "Kamień szlifierski", tx: 55, ty: 62, w: 1, h: 1 },
    { typ: "stol",     nazwa: "Stół rzemieślniczy", tx: 63, ty: 62, w: 2, h: 1 },
    { typ: "kowadlo",  nazwa: "Kowadło",            tx: 62, ty: 60, w: 1, h: 1 },
    { typ: "odlewnia", nazwa: "Odlewnia",           tx: 55, ty: 60, w: 2, h: 2, px: 56.5 * T }
  );
  L.przedmioty.forEach(o => {
    for (let dy = 0; dy < o.h; dy++)
      for (let dx = 0; dx < o.w; dx++)
        c[I(o.tx + dx, o.ty + dy)] = 10;
  });
  L.pochodnie.push([56, CY0], [63, CY0], [58, CY0 + CH - 1], [61, CY0 + CH - 1]);

  const jask = JASKINIE_DEF.filter(d => d.isl === "glowna");
  jask.forEach(d => postawKopiec(L, d));

  posadzDrzewa(L, (tx, ty) =>
    (tx >= CX0 - 3 && tx <= CX0 + CW + 2 && ty >= CY0 - 3 && ty <= CY0 + CH + 11) ||
    (tx >= 56 && tx <= 63 && ty >= 77) ||
    bliskoKopca(tx, ty, jask));
  return L;
}

// ---------- Mniejsze wyspy ----------
function zbudujWyspe(def) {
  const S = 70;
  const L = nowyPoziom(S, S, "swiat", def.nazwa);
  L.id = def.id;
  L.trawa = def.trawa;
  const I = (x, y) => y * S + x;
  const c = L.cm;
  const cx = S / 2, cy = S / 2 - 2;
  for (let ty = 0; ty < S; ty++) {
    for (let tx = 0; tx < S; tx++) {
      const nx = (tx + 0.5 - cx) / 32, ny = (ty + 0.5 - cy) / 30;
      const r = nx * nx + ny * ny + 0.05 * Math.sin(tx * 0.45 + def.seed * 3) + 0.05 * Math.sin(ty * 0.4 + def.seed);
      if (r > 1) c[I(tx, ty)] = 25;
      else if (r > 0.8) c[I(tx, ty)] = 26;
    }
  }
  [34, 35].forEach(tx => {
    for (let ty = 58; ty <= 66; ty++) c[I(tx, ty)] = 30;
    c[I(tx, 67)] = 31;
    L.portale[I(tx, 67)] = { statek: true };
  });
  L.spawn = { x: 35 * T, y: 65 * T + 12 };
  L.dok = { x: 35 * T, y: 67 * T + 16 };
  L.pochodnie.push([33, 62], [36, 62]);

  const jask = JASKINIE_DEF.filter(d => d.isl === def.id);
  jask.forEach(d => postawKopiec(L, d));

  posadzDrzewa(L, (tx, ty) => (tx >= 30 && tx <= 39 && ty >= 52) || bliskoKopca(tx, ty, jask));
  return L;
}

// ---------- Generator jaskiń (4 poziomy) ----------
function zbudujJaskinie(d, lev) {
  const S = 80 + lev * 10, w = S, h = S;
  const seedN = d.seed * 10 + lev + 1;
  const L = nowyPoziom(w, h, "jaskinia", d.nazwa + " – poziom " + (lev + 1));
  L.pal = PAL[lev];
  const ore = d.rudy[lev];
  const r = rng(seedN);
  const c = L.cm;
  c.fill(20);
  const I = (x, y) => y * w + x;
  const roomMask = new Uint8Array(w * h);
  const prot = new Uint8Array(w * h);
  const rooms = [], komory = [];
  const wx = Math.floor(w / 2);

  function wytnij(x, y) {
    if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) return;
    if (c[I(x, y)] === 20) c[I(x, y)] = 21;
  }
  function wytnijPokoj(x, y, rw, rh, okragly) {
    const cx = x + rw / 2, cy = y + rh / 2;
    for (let ty = y; ty < y + rh; ty++) {
      for (let tx = x; tx < x + rw; tx++) {
        if (okragly) {
          const nx = (tx + 0.5 - cx) / (rw / 2), ny = (ty + 0.5 - cy) / (rh / 2);
          if (nx * nx + ny * ny > 1) continue;
        }
        wytnij(tx, ty);
        if (tx > 0 && ty > 0 && tx < w - 1 && ty < h - 1) roomMask[I(tx, ty)] = 1;
      }
    }
    return { x, y, w: rw, h: rh, cx: Math.floor(cx), cy: Math.floor(cy) };
  }
  function chron(px, py, k) {
    for (let dy = -k; dy <= k; dy++) for (let dx = -k; dx <= k; dx++) {
      const X = px + dx, Y = py + dy;
      if (X > 0 && Y > 0 && X < w - 1 && Y < h - 1) prot[I(X, Y)] = 1;
    }
  }

  const wej = wytnijPokoj(wx - 6, h - 13, 12, 10, false);
  rooms.push(wej);
  c[I(wx - 1, h - 3)] = 23;
  c[I(wx, h - 3)] = 23;
  for (let ty = h - 13; ty < h - 2; ty++) for (let tx = wx - 7; tx <= wx + 6; tx++) chron(tx, ty, 0);
  L.exitLabel = lev === 0 ? "Wyjście" : "W górę";
  const upFn = () => {
    if (lev === 0) {
      const isl = POZIOMY[d.isl];
      return { cel: isl, x: (d.wx + 2) * T, y: (d.wy + 3) * T + 12 };
    }
    const prev = getCave(d, lev - 1);
    return { cel: prev, x: prev.stairs.x, y: prev.stairs.y };
  };
  [wx - 1, wx].forEach(tx => { L.portale[I(tx, h - 3)] = { fn: upFn }; });

  const ile = Math.floor(S * S / 260);
  for (let proby = 0; rooms.length < ile && proby < 3000; proby++) {
    const rw = 6 + Math.floor(r() * 11), rh = 6 + Math.floor(r() * 9);
    const x = 3 + Math.floor(r() * (w - rw - 6)), y = 3 + Math.floor(r() * (h - rh - 6));
    if (rooms.some(o => x < o.x + o.w + 3 && x + rw + 3 > o.x && y < o.y + o.h + 3 && y + rh + 3 > o.y)) continue;
    rooms.push(wytnijPokoj(x, y, rw, rh, r() < 0.5));
  }
  rooms.sort((a, b) =>
    Math.hypot(a.cx - wej.cx, a.cy - wej.cy) - Math.hypot(b.cx - wej.cx, b.cy - wej.cy));

  let krok = 0;
  function korytarz(a, b, szer) {
    const lo = szer === 3 ? -1 : 0, hi = 1;
    const mx = Math.max(4, Math.min(w - 5, Math.floor((a.cx + b.cx) / 2 + (r() - 0.5) * 14)));
    const my = Math.max(4, Math.min(h - 5, Math.floor((a.cy + b.cy) / 2 + (r() - 0.5) * 14)));
    const wp = [[a.cx, a.cy], [mx, my], [b.cx, b.cy]];
    for (let s = 0; s < 2; s++) {
      const pts = [];
      let x = wp[s][0], y = wp[s][1];
      const x1 = wp[s + 1][0], y1 = wp[s + 1][1];
      pts.push([x, y, "h"]);
      const ruchX = () => { while (x !== x1) { x += Math.sign(x1 - x); pts.push([x, y, "h"]); } };
      const ruchY = () => { while (y !== y1) { y += Math.sign(y1 - y); pts.push([x, y, "v"]); } };
      if (r() < 0.5) { ruchX(); ruchY(); } else { ruchY(); ruchX(); }
      pts.forEach(([px, py, dir]) => {
        for (let dy = lo; dy <= hi; dy++) for (let dx = lo; dx <= hi; dx++) wytnij(px + dx, py + dy);
        chron(px, py, 2);
        if (!roomMask[I(px, py)]) L.deko[I(px, py)] = 1;
        krok++;
        if (krok % 9 === 4 && !roomMask[I(px, py)]) {
          const tx = dir === "h" ? px : px + 1, ty = dir === "h" ? py + 1 : py;
          if (c[I(tx, ty)] === 21) L.pochodnie.push([tx, ty]);
        }
      });
    }
  }
  for (let i = 1; i < rooms.length; i++) {
    let best = 0, bd = 1e9;
    for (let j = 0; j < i; j++) {
      const dd = Math.hypot(rooms[i].cx - rooms[j].cx, rooms[i].cy - rooms[j].cy);
      if (dd < bd) { bd = dd; best = j; }
    }
    korytarz(rooms[best], rooms[i], r() < 0.6 ? 3 : 2);
  }
  for (let k = 0; k < Math.floor(rooms.length / 4); k++) {
    const a = rooms[Math.floor(r() * rooms.length)], b = rooms[Math.floor(r() * rooms.length)];
    if (a === b) continue;
    if (Math.hypot(a.cx - b.cx, a.cy - b.cy) < 45) korytarz(a, b, 2);
  }

  if (lev < 3) {
    const sr = rooms[rooms.length - 1];
    const sx = sr.cx, sy = sr.cy;
    for (let dy = -1; dy <= 2; dy++) for (let dx = -2; dx <= 1; dx++) wytnij(sx + dx, sy + dy);
    for (let dy = -2; dy <= 3; dy++) for (let dx = -3; dx <= 2; dx++) {
      const X = sx + dx, Y = sy + dy;
      if (X > 0 && Y > 0 && X < w - 1 && Y < h - 1) prot[I(X, Y)] = 1;
    }
    c[I(sx - 1, sy)] = 24;
    c[I(sx, sy)] = 24;
    L.stairs = { x: sx * T, y: (sy + 1) * T + 12, tx: sx, ty: sy };
    L.pochodnie.push([sx - 2, sy - 1], [sx + 1, sy - 1]);
    const downFn = () => { const n = getCave(d, lev + 1); return { cel: n, x: n.start.x, y: n.start.y }; };
    [sx - 1, sx].forEach(tx => { L.portale[I(tx, sy)] = { fn: downFn, boss: true }; });
    L.boss = nowyBoss(d, lev, sx, sy);
  } else {
    L.stairs = null;
  }

  for (let k = 0; k < Math.floor(S / 8); k++) {
    let x = 0, y = 0, ok = false;
    for (let t = 0; t < 200; t++) {
      x = 2 + Math.floor(r() * (w - 4)); y = 2 + Math.floor(r() * (h - 4));
      if (c[I(x, y)] === 21) { ok = true; break; }
    }
    if (!ok) continue;
    const dir = [[1, 0], [-1, 0], [0, 1], [0, -1]][Math.floor(r() * 4)];
    const len = 8 + Math.floor(r() * 12);
    const cx = x + dir[0] * len, cy = y + dir[1] * len;
    if (cx < 6 || cy < 6 || cx > w - 7 || cy > h - 7) continue;
    let wolneMiejsce = true;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (c[I(cx + dx, cy + dy)] !== 20) wolneMiejsce = false;
    if (!wolneMiejsce) continue;
    for (let s = 0; s <= len; s++) {
      const px = x + dir[0] * s, py = y + dir[1] * s;
      for (let dy = 0; dy <= 1; dy++) for (let dx = 0; dx <= 1; dx++) wytnij(px + dx, py + dy);
      chron(px, py, 2);
    }
    const kom = wytnijPokoj(cx - 2, cy - 2, 5, 5, true);
    komory.push(kom);
    if (c[I(cx - 1, cy - 1)] === 21) L.pochodnie.push([cx - 1, cy - 1]);
  }

  rooms.forEach((rm, i) => {
    if (i === 0) return;
    if (rm.w >= 9 && rm.h >= 9) {
      for (let ty = rm.y; ty < rm.y + rm.h; ty++) for (let tx = rm.x; tx < rm.x + rm.w; tx++) {
        const q = I(tx, ty);
        if (c[q] === 21 && roomMask[q] && !prot[q] && r() < 0.04) c[q] = 20;
      }
    }
    if (rm.w >= 11 && rm.h >= 11 && r() < 0.5) {
      const ox = rm.cx + (r() < 0.5 ? -4 : 4), oy = rm.cy + (r() < 0.5 ? -4 : 4);
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        if (dx * dx + dy * dy > 5) continue;
        const q = I(ox + dx, oy + dy);
        if (c[q] === 21 && roomMask[q] && !prot[q]) c[q] = 25;
      }
    }
  });

  const szum = (x, y) => (Math.sin(x * 0.33 + seedN) + Math.sin(y * 0.29 + seedN * 2) + Math.sin((x + y) * 0.21 + seedN * 3)) / 6 + 0.5;
  const maxD = Math.hypot(w, h) * 0.6;
  function polozRude(tx, ty) {
    const dist01 = Math.min(1, Math.hypot(tx - wx, ty - (h - 8)) / maxD);
    let t = 0.6 * szum(tx, ty) + 0.5 * dist01 + (r() - 0.5) * 0.3;
    t = Math.max(0, Math.min(0.999, t));
    const rodzaj = ore[Math.floor(t * ore.length)];
    const def = RUDY_DEF[rodzaj];
    L.rudy.push({ typ: "ruda", rodzaj, item: def.item, tx, ty, hp: def.hp, maxhp: def.hp, shake: 0, bar: 0, respawn: 0 });
    L.rudyGrid[I(tx, ty)] = L.rudy.length;
  }
  function posiejRudy(rm, p) {
    for (let ty = rm.y; ty < rm.y + rm.h; ty++) for (let tx = rm.x; tx < rm.x + rm.w; tx++) {
      const q = I(tx, ty);
      if (c[q] !== 21 || !roomMask[q] || prot[q] || L.rudyGrid[q]) continue;
      const blisko = c[I(tx + 1, ty)] === 20 || c[I(tx - 1, ty)] === 20 || c[I(tx, ty + 1)] === 20 || c[I(tx, ty - 1)] === 20;
      if (r() < p * (blisko ? 1.7 : 0.6)) polozRude(tx, ty);
    }
  }
  rooms.forEach((rm, i) => { if (i > 0) posiejRudy(rm, 0.14); });
  komory.forEach(rm => posiejRudy(rm, 0.45));

  L.pochodnie.push([wx - 3, h - 5], [wx + 2, h - 5]);
  rooms.forEach((rm, i) => {
    if (i === 0) return;
    const n = 2 + Math.floor(rm.w * rm.h / 70);
    let postawione = 0;
    for (let t = 0; t < n * 8 && postawione < n; t++) {
      const tx = rm.x + Math.floor(r() * rm.w), ty = rm.y + Math.floor(r() * rm.h);
      const q = I(tx, ty);
      if (c[q] === 21 && roomMask[q] && !L.rudyGrid[q] &&
          (c[I(tx + 1, ty)] === 20 || c[I(tx - 1, ty)] === 20 || c[I(tx, ty + 1)] === 20 || c[I(tx, ty - 1)] === 20)) {
        L.pochodnie.push([tx, ty]);
        postawione++;
      }
    }
  });

  L.start = { x: wx * T, y: (h - 5) * T + 12 };
  L.odk = new Uint8Array(w * h);
  L.mmc = document.createElement("canvas");
  L.mmc.width = w; L.mmc.height = h;
  L.mmx = L.mmc.getContext("2d");
  L.mmImg = L.mmx.createImageData(w, h);
  L.mmDirty = false;
  return L;
}

function twarde(px, py) {

  const t = cm[idx(tx, ty)];

  const ri = rudyGrid[idx(tx, ty)];

  return false;
}
function wolne(px, py) {

}

const SLOTY = 24;
const inv = new Array(SLOTY).fill(null);
inv[0] = { id: "siekiera_miedz", n: 1 };
inv[1] = { id: "kilof_miedz", n: 1 };
let sel = 0;
let invOtwarty = false;
let dragFrom = -1;
const mysz = { x: 0, y: 0 };

const EQ = ["helm", "napiersnik", "nogawice"];
const EQ_NAZWY = ["Hełm", "Napierśnik", "Nogawice"];
const equip = [null, null, null];
function getItem(ref) { return ref >= 100 ? equip[ref - 100] : inv[ref]; }
function setItem(ref, v) { if (ref >= 100) equip[ref - 100] = v; else inv[ref] = v; }
function pasuje(ref, it) {
  if (!it) return true;
  if (ref >= 100) return ITEMY[it.id].typ === EQ[ref - 100];
  return true;
}
function przenies(a, b) {
  const A = getItem(a), B = getItem(b);
  if (!pasuje(b, A) || !pasuje(a, B)) { tekst("To nie pasuje do tego miejsca"); return; }
  if (A && B && a < 100 && b < 100 && A.id === B.id && ITEMY[A.id].stos > 1) {
    const mv = Math.min(A.n, ITEMY[A.id].stos - B.n);
    B.n += mv; A.n -= mv;
    if (A.n <= 0) setItem(a, null);
  } else {
    setItem(a, B);
    setItem(b, A);
  }
}
function autoZaloz(i) {
  const it = inv[i];
  if (!it) return;
  const e = EQ.indexOf(ITEMY[it.id].typ);
  if (e < 0) return;
  const stary = equip[e];
  equip[e] = it;
  inv[i] = stary;
  dragFrom = -1;
}
function zdejmij(e) {
  const it = equip[e];
  if (!it) return;
  const j = inv.indexOf(null);
  if (j < 0) { tekst("Ekwipunek pełny!"); return; }
  inv[j] = it;
  equip[e] = null;
  dragFrom = -1;
}
function lacznaObrona() { const b = equip.reduce((s, it) => s + (it ? obrona(it) : 0), 0); return pelnyKomplet() ? Math.round(b * 1.2) : b; }

function typTrz() { const it = inv[sel]; return it ? (ITEMY[it.id].typ || null) : null; }
function potrzebneNarzedzie(o) { return o.typ === "drzewo" ? "siekiera" : "kilof"; }
function wezNarzedzie(typ) {
  if (typTrz() === typ) return true;
  let best = -1, bv = -1;
  for (let i = 0; i < 8; i++) {
    const it = inv[i];
    if (it && ITEMY[it.id].typ === typ) {
      const v = mocNarz(it);
      if (v > bv) { bv = v; best = i; }
    }
  }
  if (best >= 0) { sel = best; return true; }
  return false;
}

function miejsceNa(id) {
  const max = ITEMY[id].stos;
  return inv.some(s => s === null || (s.id === id && s.n < max));
}
function dodaj(id, n) {
  const max = ITEMY[id].stos;
  for (let i = 0; i < SLOTY && n > 0; i++) {
    const s = inv[i];
    if (s && s.id === id && s.n < max) {
      const d = Math.min(n, max - s.n);
      s.n += d; n -= d;
    }
  }
  for (let i = 0; i < SLOTY && n > 0; i++) {
    if (inv[i] === null) {
      const d = Math.min(n, max);
      inv[i] = { id, n: d }; n -= d;
    }
  }
  return n;
}
function licz(id) {
  let s = 0;
  for (const it of inv) if (it && it.id === id) s += it.n;
  return s;
}
function usun(id, n) {
  for (let i = SLOTY - 1; i >= 0 && n > 0; i--) {
    const s = inv[i];
    if (s && s.id === id) {
      const d = Math.min(n, s.n);
      s.n -= d; n -= d;
      if (s.n <= 0) inv[i] = null;
    }
  }
}
function dodajMonete(tier) {
  const id = MONETY[tier];
  const razem = licz(id);
  if (razem + 1 >= 99) {
    if (tier < MONETY.length - 1) {
      usun(id, razem);
      dodajMonete(tier + 1);
    } else {
      dodaj(id, 1);
    }
  } else {
    dodaj(id, 1);
  }
}

let statekOtwarty = false;
let statekBlok = false;
const odblokowane = { glowna: true };
let statekMsg = "", statekMsgDo = 0;

function lacznieMiedzi() {
  return MONETY.reduce((s, id) => s + licz(id) * WART[id], 0);
}
function zaplac(koszt) {
  let reszta = lacznieMiedzi() - koszt;
  MONETY.forEach(id => usun(id, licz(id)));
  for (let i = MONETY.length - 1; i >= 0; i--) {
    const w = WART[MONETY[i]];
    const n = Math.floor(reszta / w);
    reszta -= n * w;
    if (n > 0) dodaj(MONETY[i], n);
  }
}
function tekstCeny(c) {
  if (c <= 0) return "0";
  const nazwy = [["platyna", "plat."], ["zloto", "zł"], ["srebro", "sr."], ["miedz", "mdz."]];
  const czesci = [];
  nazwy.forEach(([id, skrot]) => {
    const n = Math.floor(c / WART[id]);
    c -= n * WART[id];
    if (n > 0) czesci.push(n + " " + skrot);
  });
  return czesci.join(" ");
}

function listaWysp() { return WYSPY_DEF.filter(w => w.id !== lvl.id); }
function statekRect() {

// ---------- Stanowiska rzemieślnicze ----------
const STACJE_TYPY = { sklep: 1, piec: 1, odlewnia: 1, kowadlo: 1, kamien: 1 };
let stacja = null;
let otwartyObj = null;
const KOSZT_SZLIFU = 50 * WART.zloto;

function odlegloscDoObiektu(o) {
  const rx = Math.max(o.tx * T, Math.min((o.tx + o.w) * T, gracz.x));
  const ry = Math.max(o.ty * T, Math.min((o.ty + o.h) * T, gracz.y + 6));
  return Math.hypot(rx - gracz.x, ry - (gracz.y + 6));
}
function najblizszaStacja(max) {
  let best = null, bd = max;
  for (const o of przedmioty) {
    if (!STACJE_TYPY[o.typ]) continue;
    const d = odlegloscDoObiektu(o);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}
function wskazStacje(wx, wy) {
  for (const o of przedmioty) {
    if (!STACJE_TYPY[o.typ]) continue;
    const gora = (o.typ === "piec" || o.typ === "odlewnia") ? 38 : 10;
    if (wx >= o.tx * T && wx <= (o.tx + o.w) * T && wy >= o.ty * T - gora && wy <= (o.ty + o.h) * T) return o;
  }
  return null;
}
function otworzStacje(o) {
  gracz.cel = null; gracz.obiekt = null; gracz.doStacji = null;
  otwartyObj = o;
  if (o.typ === "sklep") { stacja = null; sklepOtwarty = true; return; }
  sklepOtwarty = false;
  stacja = { typ: o.typ, tab: 0, scroll: 0, msg: "", msgDo: 0 };
}
function zamknijStacje() { stacja = null; sklepOtwarty = false; otwartyObj = null; }
function msgStacji(t) { if (stacja) { stacja.msg = t; stacja.msgDo = Date.now() + 2500; } }

function przetop(k, ile) {
  const rid = "ruda_" + k, pid = "plynna_" + k;
  ile = Math.min(ile, Math.floor(licz(rid) / 3));
  let zrobione = 0;
  for (let i = 0; i < ile; i++) {
    usun(rid, 3);
    if (dodaj(pid, 1) > 0) { dodaj(rid, 3); msgStacji("Brak miejsca w ekwipunku!"); break; }
    zrobione++;
  }
  if (zrobione) msgStacji("Wytopiono: " + zrobione + " × " + ITEMY[pid].nazwa);
}
function odlej(k, ile) {
  const pid = "plynna_" + k, sid = "sztabka_" + k;
  ile = Math.min(ile, Math.floor(licz(pid) / 2));
  let zrobione = 0;
  for (let i = 0; i < ile; i++) {
    usun(pid, 2);
    if (dodaj(sid, 1) > 0) { dodaj(pid, 2); msgStacji("Brak miejsca w ekwipunku!"); break; }
    zrobione++;
  }
  if (zrobione) msgStacji("Odlano: " + zrobione + " × " + ITEMY[sid].nazwa);
}
function wykuj(typ, k) {
  const koszt = TYPY_GEAR[typ].koszt, sid = "sztabka_" + k, id = typ + "_" + k;
  if (licz(sid) < koszt) { msgStacji("Za mało sztabek!"); return; }
  usun(sid, koszt);
  if (dodaj(id, 1) > 0) { dodaj(sid, koszt); msgStacji("Brak miejsca w ekwipunku!"); return; }
  msgStacji("Wykuto: " + ITEMY[id].nazwa);
}
function szlifuj(ref) {
  const it = getItem(ref);
  if (!it) return;
  if (lacznieMiedzi() < KOSZT_SZLIFU) { msgStacji("Za mało monet! Potrzeba 50 złota."); return; }
  zaplac(KOSZT_SZLIFU);
  const it2 = getItem(ref) || it;
  if (Math.random() < 0.2) {
    const pula = BUFY[kategoria(ITEMY[it2.id].typ)];
    it2.buf = Object.assign({}, pula[Math.floor(Math.random() * pula.length)]);
    msgStacji("Sukces! " + nazwaPrzedmiotu(it2));
  } else {
    msgStacji("Nie udało się. Straciłeś 50 złota.");
  }
}

const SPECJALNE = [
  { id: "bron_enchanted_sword", koszt: { sztabka_demonit: 8, sztabka_zloto: 5, sztabka_cyna: 5 } }
];
function wykujSpecjalne(r) {
  if (!Object.keys(r.koszt).every(s => licz(s) >= r.koszt[s])) { msgStacji("Za mało sztabek!"); return; }
  Object.keys(r.koszt).forEach(s => usun(s, r.koszt[s]));
  if (dodaj(r.id, 1) > 0) { Object.keys(r.koszt).forEach(s => dodaj(s, r.koszt[s])); msgStacji("Brak miejsca w ekwipunku!"); return; }
  msgStacji("Wykuto: " + ITEMY[r.id].nazwa);
}
const TAB_NAZWY = ["Kilofy", "Siekiery", "Miecze", "Krótkie", "Łuki", "Włócznie", "Hełmy", "Napierś.", "Nogawice"];
const TAB_TYPY = ["kilof", "siekiera", "miecz", "krotki", "luk", "wlocznia", "helm", "napiersnik", "nogawice"];

function daneStacji() {
  const typ = stacja.typ;
  const rows = [];
  if (typ === "piec") {
    TIERY.forEach(k => {
      const n = licz("ruda_" + k);
      if (n <= 0) return;
      const m = Math.floor(n / 3);
      rows.push({
        ikona: "ruda_" + k, tytul: ITEMY["ruda_" + k].nazwa,
        l2: "Masz: " + n + " (3 szt. → 1 płynna ruda)", l3: ITEMY["plynna_" + k].nazwa, ok: m > 0,
        akcje: [{ t: "×1", ok: m > 0, fn: () => przetop(k, 1) }, { t: "Wszystko", w: 80, ok: m > 0, fn: () => przetop(k, m) }]
      });
    });
    return { tytul: "Piec hutniczy", info: "3 sztuki rudy → 1 płynna ruda tego samego rodzaju", pusto: "Brak rud (potrzeba min. 3 sztuk jednego rodzaju).", rows };
  }
  if (typ === "odlewnia") {
    TIERY.forEach(k => {
      const n = licz("plynna_" + k);
      if (n <= 0) return;
      const m = Math.floor(n / 2);
      rows.push({
        ikona: "plynna_" + k, tytul: ITEMY["plynna_" + k].nazwa,
        l2: "Masz: " + n + " (2 szt. → 1 sztabka)", l3: ITEMY["sztabka_" + k].nazwa, ok: m > 0,
        akcje: [{ t: "×1", ok: m > 0, fn: () => odlej(k, 1) }, { t: "Wszystko", w: 80, ok: m > 0, fn: () => odlej(k, m) }]
      });
    });
    return { tytul: "Odlewnia", info: "2 płynne rudy → 1 sztabka tego samego rodzaju", pusto: "Brak płynnych rud (przetop rudę w piecu).", rows };
  }
  if (typ === "kowadlo") {
    const t = TAB_TYPY[stacja.tab];
    if (t === "miecz") {
      SPECJALNE.forEach(r => {
        const ids = Object.keys(r.koszt), ok = ids.every(s => licz(s) >= r.koszt[s]);
        rows.push({
          ikona: r.id, tytul: ITEMY[r.id].nazwa, l2: statLinia({ id: r.id }),
          l3: "Koszt: " + ids.map(s => r.koszt[s] + "× " + ITEMY[s].nazwa.replace("Sztabka ", "")).join(", ") + " (masz " + ids.map(s => licz(s)).join("/") + ")", ok,
          akcje: [{ t: "Wykuj", ok, fn: () => wykujSpecjalne(r) }]
        });
      });
    }
    TIERY.forEach(k => {
      const id = t + "_" + k, koszt = TYPY_GEAR[t].koszt, ma = licz("sztabka_" + k);
      rows.push({
        ikona: id, tytul: ITEMY[id].nazwa, l2: statLinia({ id }),
        l3: "Koszt: " + koszt + " × " + ITEMY["sztabka_" + k].nazwa + " (masz " + ma + ")", ok: ma >= koszt,
        akcje: [{ t: "Wykuj", ok: ma >= koszt, fn: () => wykuj(t, k) }]
      });
    });
    ZB_LISTA.filter(z => z.typ === t).forEach(z => rows.push(wierszReceptury(z)));
    return { tytul: "Kowadło", info: "Wykuwaj narzędzia, bronie i zbroje ze sztabek", tabs: TAB_NAZWY, rows };
  }
  const stac = lacznieMiedzi() >= KOSZT_SZLIFU;
  const refy = [];
  for (let i = 0; i < SLOTY; i++) refy.push(i);
  [100, 101, 102].forEach(r => refy.push(r));
  refy.forEach(ref => {
    const it = getItem(ref);
    if (!it || !ITEMY[it.id].typ) return;
    rows.push({
      ikona: it.id, tytul: nazwaPrzedmiotu(it) + (ref >= 100 ? " [założone]" : ""), l2: statLinia(it),
      l3: it.buf ? "Ma bonus – nowy go zastąpi" : "Szansa 1/5 na losowy bonus", ok: stac,
      akcje: [{ t: "Szlifuj (50 zł)", w: 120, ok: stac, fn: () => szlifuj(ref) }]
    });
  });
  return { tytul: "Kamień szlifierski", info: "50 złota za próbę · szansa 1/5 na bonus · masz: " + tekstCeny(lacznieMiedzi()), pusto: "Nie masz narzędzi, broni ani zbroi.", rows };
}

function ukladStacji() {
  if (!stacja) return null;
  const d = daneStacji();
  const pw = d.tabs ? 620 : 480, rowH = 58;
  const hasTabs = !!d.tabs;
  const topH = 62 + (hasTabs ? 36 : 0);
  const dostepne = Math.min(H - 120, 660);
  const vis = Math.max(2, Math.min(Math.max(d.rows.length, 2), Math.floor((dostepne - topH - 36) / rowH)));
  const ph = topH + vis * rowH + 36;
  const px = Math.floor((W - pw) / 2);
  const py = Math.max(8, Math.floor((H - 90 - ph) / 2));
  const scrollMax = Math.max(0, d.rows.length - vis);
  stacja.scroll = Math.max(0, Math.min(scrollMax, stacja.scroll));
  const u = {
    r: { x: px, y: py, w: pw, h: ph }, dane: d, vis, scrollMax, topH, rowH,
    zamknij: { x: px + pw - 34, y: py + 10, w: 24, h: 24 }, tabs: [], rows: []
  };
  if (hasTabs) {
    const tw = (pw - 32) / d.tabs.length;
    d.tabs.forEach((t, i) => u.tabs.push({ x: px + 16 + i * tw, y: py + 62, w: tw - 4, h: 28, t, i }));
  }
  for (let i = 0; i < vis; i++) {
    const ix = stacja.scroll + i;
    if (ix >= d.rows.length) break;
    const row = d.rows[ix];
    const rect = { x: px + 16, y: py + topH + i * rowH, w: pw - 32, h: rowH - 4 };
    const btns = [];
    let bx = rect.x + rect.w - 8;
    for (let j = row.akcje.length - 1; j >= 0; j--) {
      const a = row.akcje[j];
      const bw = a.w || 74;
      bx -= bw;
      btns.push({ x: bx, y: rect.y + (rect.h - 30) / 2, w: bw, h: 30, a });
      bx -= 6;
    }
    u.rows.push({ rect, row, btns });
  }
  return u;
}

function obsluzKlikStacji(mx, my) {
  const u = ukladStacji();
  if (!u) return false;
  if (wRect(u.zamknij, mx, my)) { zamknijStacje(); return true; }
  for (const t of u.tabs) {
    if (wRect(t, mx, my)) { stacja.tab = t.i; stacja.scroll = 0; return true; }
  }
  for (const rw of u.rows) {
    for (const b of rw.btns) {
      if (wRect(b, mx, my)) { b.a.fn(); return true; }
    }
  }
  return wRect(u.r, mx, my);
}

function rysujStacjeUI() {
  const u = ukladStacji();

  ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);

  ctx.font = "bold 20px Arial";
  ctx.textAlign = "left";
  ctx.fillText(d.tytul, r.x + 20, r.y + 34);

    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";
    ctx.fillText(t.t, t.x + t.w / 2, t.y + 18);

  if (!d.rows.length) {

    ctx.fillText(d.pusto, r.x + 20, r.y + u.topH + 26);
  }

  u.rows.forEach(({ rect, row, btns }) => {
    const hover = wRect(rect, mysz.x, mysz.y);
    ctx.fillStyle = row.ok ? (hover ? "#2c4a35" : "#233b2b") : (hover ? "#3a2f33" : "#2e262a");
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.strokeStyle = row.ok ? "#5f9d6f" : "#6b5a5e";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
    rysujIkone(row.ikona, rect.x + 2, rect.y + (rect.h - 48) / 2, 48);
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px Arial";
    ctx.fillText(row.tytul, rect.x + 56, rect.y + 17);
    ctx.fillStyle = "#cfd8dc";
    ctx.font = "11px Arial";
    ctx.fillText(row.l2, rect.x + 56, rect.y + 32);
    ctx.fillStyle = row.ok ? "#aee6b4" : "#d9a8a0";
    ctx.fillText(row.l3, rect.x + 56, rect.y + 46);
    btns.forEach(b => {
      ctx.fillStyle = b.a.ok ? (wRect(b, mysz.x, mysz.y) ? "#43a047" : "#2e7d32") : "#555";
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = b.a.ok ? "#81c784" : "#777";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(b.a.t, b.x + b.w / 2, b.y + 20);
    });
  });

  ctx.textAlign = "center";
  if (Date.now() < stacja.msgDo) {
    ctx.fillStyle = "#ffe082";
    ctx.font = "bold 13px Arial";
    ctx.fillText(stacja.msg, r.x + r.w / 2, r.y + r.h - 12);
  } else if (u.scrollMax > 0) {
    ctx.fillStyle = "#999";
    ctx.font = "12px Arial";
    ctx.fillText("Przewiń kółkiem myszy (" + (stacja.scroll + 1) + "–" + (stacja.scroll + u.rows.length) + " z " + d.rows.length + ")", r.x + r.w / 2, r.y + r.h - 12);
  }
}

// ---------- Tekstury kafelków (styl Terrarii) ----------
const zielenie = ["#4f9d2d", "#478f28", "#58aa33", "#3f8423"];

function piasekTex(v) { return TC_("pi" + v, () => mkSzum(["#e8d086", "#dfc57a", "#d6bb6e", "#ecd78f"], 50 + v, 1, "#f5e6a8", "#c4a95c")); }
function rysujWode(tx, ty, x, y) {
  ctx.fillStyle = "#2a5fc0";
  ctx.fillRect(x, y, T, T);
  const o = Math.sin(czas * 1.5 + tx * 0.8 + ty * 0.5) * 3;
  ctx.fillStyle = "#4f86e6";
  ctx.fillRect(x + 4 + o, y + 8, 10, 2);
  ctx.fillRect(x + 16 - o, y + 22, 10, 2);
  ctx.fillStyle = "#1f4aa0";
  ctx.fillRect(x + 2, y + 28, 8, 2);
  ctx.fillRect(x + 20, y + 14, 8, 2);
}

function rysujZamekKafelek(tx, ty, t, x, y) {
  const v = Math.floor(hash(tx, ty, 9) * 4);
  if (t === 7) { // ścieżka
    dt(TC_("scz" + v, () => mkSzum(["#a37a4b", "#ad8350", "#98703f", "#a67d4c"], 30 + v, 1, "#bf955f", "#85602f")), x, y);
    return;
  }
  if (t === 1 || t === 9) { // mur / wieża
    dt(TC_("ceg" + t + v, () => tekstCegla(t === 9 ? "#7e7e8c" : "#8f8f9a", v)), x, y);
    return;
  }
  dt(TC_("des" + v, () => tekstDeski(v, false)), x, y);
  if (t === 3) {
    ctx.fillStyle = "#4a2e14";
    ctx.fillRect(x, y, 3, T);
    ctx.fillRect(x + T - 3, y, 3, T);
  }
}

function rysujWodePiasekPomost(tx, ty, t, x, y) {
  const v = Math.floor(hash(tx, ty, 9) * 4);
  if (t === 26) { dt(piasekTex(v), x, y); return; }
  if (t === 25) { rysujWode(tx, ty, x, y); return; }
  dt(TC_("molo" + v, () => tekstDeski(v, true)), x, y);
  ctx.fillStyle = "#4a2e14";
  ctx.fillRect(x, y, 3, T);
  ctx.fillRect(x + T - 3, y, 3, T);
  if (t === 31) {
    ctx.fillStyle = "rgba(79,195,247," + (0.2 + 0.1 * Math.sin(czas * 3)) + ")";
    ctx.fillRect(x, y, T, T);
  }
}

function rysujJaskiniaKafelek(tx, ty, t, x, y) {
  const wJaskini = lvl.typ === "jaskinia";
  const P = wJaskini ? (lvl.pal || PAL[0]) : SPOW;
  const v = Math.floor(hash(tx, ty, 9) * 4);
  const stoneTex = () => TC_("kam" + P.id + v, () => mkSzum([P.s[0], P.s[1]], 70 + v, 2, P.d[0], P.d[1], true));
  const floorTex = () => TC_("pod" + P.id + v, () => mkSzum([P.f ? P.f[0] : "#4a4540", P.f ? P.f[1] : "#433e39"], 90 + v, 2, P.fd ? P.fd[0] : "#5c564f", P.fd ? P.fd[1] : "#37332f"));
  if (t === 20) {
    if (wJaskini) {
      let blisko = false;
      for (let dy = -1; dy <= 1 && !blisko; dy++) for (let dx = -1; dx <= 1; dx++) {
        const X = tx + dx, Y = ty + dy;
        if (X < 0 || Y < 0 || X >= MAP_W || Y >= MAP_H) continue;
        if (cm[idx(X, Y)] !== 20) { blisko = true; break; }
      }
      if (!blisko) { ctx.fillStyle = "#1d1b19"; ctx.fillRect(x, y, T, T); return; }
    }
    dt(stoneTex(), x, y);
    return;
  }
  if (t === 22) { // wejście do jaskini (powierzchnia)
    const Q = PAL[0];
    dt(TC_("pod0" + v, () => mkSzum([Q.f[0], Q.f[1]], 90 + v, 2, Q.fd[0], Q.fd[1])), x, y);
    ctx.fillStyle = "#0c0a08";
    ctx.fillRect(x + 2, y + 6, T - 4, T - 6);
    dt(TC_("kamS" + v, () => mkSzum([SPOW.s[0], SPOW.s[1]], 70 + v, 2, SPOW.d[0], SPOW.d[1], true)), x, y - 0);
    ctx.fillStyle = "#0c0a08";
    ctx.fillRect(x + 3, y + 8, T - 6, T - 8);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(x + 3, y + 8, T - 6, 6);
    return;
  }
  if (t === 25) { rysujWode(tx, ty, x, y); return; }
  dt(floorTex(), x, y);
  if (deko[idx(tx, ty)]) rysujTory(tx, ty, x, y);
  if (t === 23) {
    ctx.fillStyle = "rgba(150,230,110," + (0.4 + 0.12 * Math.sin(czas * 3)) + ")";
    ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(x + 4, y + 4, T - 8, T - 8);
  }
  if (t === 24) {
    ctx.fillStyle = "#0c0a09";
    ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = "rgba(120,110,100," + (0.5 - i * 0.1) + ")";
      ctx.fillRect(x + 3 + i * 2, y + 3 + i * 6, T - 6 - i * 4, 4);
    }
    ctx.fillStyle = "rgba(255,215,0," + (0.55 + 0.25 * Math.sin(czas * 4)) + ")";
    ctx.beginPath();
    ctx.moveTo(x + 9, y + 11); ctx.lineTo(x + 23, y + 11); ctx.lineTo(x + 16, y + 22);
    ctx.closePath(); ctx.fill();
  }
}

function rysujTory(tx, ty, x, y) {
  const h = (tx > 0 && deko[idx(tx - 1, ty)]) || (tx < MAP_W - 1 && deko[idx(tx + 1, ty)]);
  const v = (ty > 0 && deko[idx(tx, ty - 1)]) || (ty < MAP_H - 1 && deko[idx(tx, ty + 1)]);
  if (h || !v) {
    ctx.fillStyle = "#5d4630";
    for (let s = 4; s < T; s += 9) ctx.fillRect(x + s, y + 7, 4, 18);
    ctx.fillStyle = "#9aa0a6";
    ctx.fillRect(x, y + 10, T, 2);
    ctx.fillRect(x, y + 20, T, 2);
  }
  if (v) {
    ctx.fillStyle = "#5d4630";
    for (let s = 4; s < T; s += 9) ctx.fillRect(x + 7, y + s, 18, 4);
    ctx.fillStyle = "#9aa0a6";
    ctx.fillRect(x + 10, y, 2, T);
    ctx.fillRect(x + 20, y, 2, T);
  }
}

function rysujKafelek(tx, ty) {
  const x = tx * T, y = ty * T;
  const v = Math.floor(hash(tx, ty, 9) * 4);

  const t = cm[idx(tx, ty)];
  if (t) {
    if (t === 20 || t === 21 || t === 22 || t === 23 || t === 24 || t === 25) rysujJaskiniaKafelek(tx, ty, t, x, y);
    else if (t === 26 || t === 30 || t === 31) rysujWodePiasekPomost(tx, ty, t, x, y);
    else rysujZamekKafelek(tx, ty, t, x, y);
    return;
  }

  if (tx === 0 || ty === 0 || tx === MAP_W - 1 || ty === MAP_H - 1) {
    dt(piasekTex(v), x, y);
    return;
  }

  const pal = lvl.trawa || zielenie;
  dt(TC_("tr" + lvl.id + v, () => tekstTrawa(pal, v)), x, y);

  if (hash(tx, ty, 4) < 0.05) {
    const px = x + 8 + Math.floor(hash(tx, ty, 5) * 14), py = y + 8 + Math.floor(hash(tx, ty, 6) * 14);
    const kolory = ["#ffffff", "#ffe14a", "#ff8fb8", "#c58cff"];
    ctx.fillStyle = "#2f7a1f";
    ctx.fillRect(px, py + 4, 2, 4);
    ctx.fillStyle = kolory[Math.floor(hash(tx, ty, 7) * kolory.length)];
    ctx.fillRect(px - 2, py, 2, 2); ctx.fillRect(px + 2, py, 2, 2);
    ctx.fillRect(px, py - 2, 2, 2); ctx.fillRect(px, py + 2, 2, 2);
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(px, py, 2, 2);
  }
}

// ---------- Sprite'y przedmiotów ----------
const KOLOR_MONETY = {
  miedz:   { r: "#8d4f1f", s: "#c97b3c", j: "#e8a46a" },
  srebro:  { r: "#78909c", s: "#b0bec5", j: "#eceff1" },
  zloto:   { r: "#b8860b", s: "#ffd700", j: "#fff59d" },
  platyna: { r: "#4fa3c7", s: "#d6f0fb", j: "#ffffff" }
};
const SPR = {};

function sprMoneta(rim, body, hi) {
  return mkSpr(16, 16, (P) => {
    for (let y = 1; y < 15; y++) for (let x = 1; x < 15; x++) {
      const d = Math.hypot(x - 7.5, y - 7.5);
      if (d > 5.8) continue;
      P(x, y, d > 4.6 || (d > 2.4 && d < 3.3) ? rim : body);
    }
    P(4, 4, hi); P(5, 4, hi); P(4, 5, hi);
  }, "#1a1208");
}
function sprDrewno() {
  return mkSpr(16, 16, (P) => {
    for (let y = 5; y <= 10; y++) for (let x = 2; x <= 11; x++) {
      P(x, y, y === 5 ? "#c08a50" : y === 10 ? "#5b3a1c" : (hash(x, y, 5) > 0.7 ? "#74482a" : "#8a5a32"));
    }
    for (let y = 4; y <= 11; y++) for (let x = 11; x <= 13; x++) {
      if (((x - 12) / 1.6) ** 2 + ((y - 7.5) / 3.8) ** 2 <= 1) P(x, y, "#d9ae72");
    }
    P(12, 7, "#9c6b3c"); P(12, 8, "#9c6b3c");
  }, "#1a1008");
}
function sprRuda(k) {
  const d = RUDY_DEF[k];
  return mkSpr(16, 16, (P) => {
    for (let y = 3; y < 14; y++) for (let x = 1; x < 15; x++) {
      const e = ((x - 7.5) / 6.3) ** 2 + ((y - 9) / 5) ** 2 + (hash(x, y, 77) - 0.5) * 0.25;
      if (e > 1) continue;
      P(x, y, y < 7 ? "#8e8e96" : y > 11 ? "#5a5a62" : (hash(x, y, 78) > 0.6 ? "#6f6f77" : "#7b7b83"));
    }
    [[4, 8], [9, 6], [7, 10], [11, 9]].forEach(([x, y]) => {
      P(x, y, d.kol); P(x + 1, y, d.kol); P(x, y + 1, d.kol); P(x + 1, y + 1, shade(d.kol, 0.65));
      P(x, y, d.jas);
    });
  }, "#14100c");
}
function sprButelka(k) {
  const d = RUDY_DEF[k];
  return mkSpr(16, 16, (P) => {

function sprite(id) {
  if (ARM_IM[id]) return (SPR[id] = ARM_IM[id]);
  if (SPR[id]) return SPR[id];
  let c = null;
  if (KOLOR_MONETY[id]) { const k = KOLOR_MONETY[id]; c = sprMoneta(k.r, k.s, k.j); }
  else if (ITEMY[id] && ITEMY[id].typ) { const cc = kolorGear(id); c = sprGear(ITEMY[id].typ, cc.kol, cc.jas); }
  else if (id.indexOf("ruda_") === 0) c = sprRuda(id.slice(5));
  else if (id.indexOf("plynna_") === 0) c = sprButelka(id.slice(7));
  else if (id.indexOf("sztabka_") === 0) c = sprSztabka(id.slice(8));
  else if (id === "drewno") c = sprDrewno();
  return (SPR[id] = c);
}
function rysujIkone(id, x, y, s) {
  const c = sprite(id);
  if (!c || !c.width || !c.height) return;
  const w = c.width, h = c.height;
  let k = (s - 4) / Math.max(w, h);
  if (k >= 2) k = Math.floor(k);
  const dw = Math.round(w * k), dh = Math.round(h * k);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c, x + Math.floor((s - dw) / 2), y + Math.floor((s - dh) / 2), dw, dh);
}

function sprDrzewo(seed) {

    for (let y = 19; y < 34; y++) for (let x = 11; x <= 14; x++) {
      P(x, y, x === 11 ? kor[0] : x === 14 ? kor[3] : (hash(x, y, seed) > 0.6 ? kor[2] : kor[1]));
    }
    P(10, 32, kor[1]); P(10, 33, kor[2]); P(15, 32, kor[2]); P(15, 33, kor[3]);
    const j = (i) => Math.round((hash(i, seed, 7) - 0.5) * 2);
    const kola = [[13 + j(1), 10 + j(2), 8], [7 + j(3), 15, 6], [19 + j(4), 15, 6], [13, 18 + j(5), 5]];
    const zielen = ["#86d85f", "#5fb83f", "#479a2e", "#337a21"];
    for (let y = 0; y < 26; y++) for (let x = 0; x < 26; x++) {

}
function rysujBossUI() {

  const b = lvl.boss;
  if (b && !b.dead && b.aktywny) {
    const bw = Math.min(520, W - 40), bx = (W - bw) / 2, by = H - 48 - 22 - 52;

// ---------- Gracz ----------
const ZASIEG = 44;
const gracz = {
  x: 60 * T,
  y: (CY0 + CH + 5) * T,
  v: 160,
  kierunek: 1,
  krok: 0,
  cel: null,
  obiekt: null,
  doStacji: null,
  chopT: 0.1,
  swing: 0,
  hp: 100, maxhp: 100, nietyk: 0, atakCd: 0, bezRan: 0, celBoss: false, rana: 0, atakuje: false
};

const kamera = { x: gracz.x, y: gracz.y, zoom: 2, celZoom: 2 };
let dachAlfa = 1;
let ciemnosc = 0;
let fade = 0;
let portalCd = 0;
let czas = 0;

const czastki = [];
const teksty = [];
function tekst(txt, x = gracz.x, y = gracz.y - 24) {
  teksty.push({ txt, x, y, life: 1.5 });
}

// ---------- Przejścia między poziomami ----------
function wejdzDo(cel, x, y) {
  ustawPoziom(cel);
  gracz.x = x; gracz.y = y;
  gracz.cel = null; gracz.obiekt = null; gracz.doStacji = null;
  zamknijStacje();
  statekOtwarty = false; statekBlok = false;
  kamera.x = x; kamera.y = y;
  ciemnosc = cel.typ === "jaskinia" ? 1 : 0;
  fade = 1;
  portalCd = 0.6;
  czastki.length = 0;
  teksty.length = 0;
  pociski.length = 0; strzaly.length = 0;
  if (cel.boss && !cel.boss.dead) resetBossa(cel.boss);
}

function odkrywaj() {
  if (lvl.typ !== "jaskinia") return;
  const ptx = Math.floor(gracz.x / T), pty = Math.floor((gracz.y + 6) / T), R = 9;
  const dane = lvl.mmImg.data;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    if (dx * dx + dy * dy > R * R) continue;
    const X = ptx + dx, Y = pty + dy;
    if (X < 0 || Y < 0 || X >= lvl.w || Y >= lvl.h) continue;
    const i = Y * lvl.w + X;
    if (lvl.odk[i]) continue;
    lvl.odk[i] = 1;
    const t = cm[i];
    let col;
    if (t === 20) col = [40, 38, 35];
    else if (t === 25) col = [40, 100, 160];
    else if (t === 23) col = [120, 210, 100];
    else if (t === 24) col = [255, 215, 0];
    else if (deko[i]) col = [190, 160, 110];
    else col = [150, 142, 128];
    const o = i * 4;
    dane[o] = col[0]; dane[o + 1] = col[1]; dane[o + 2] = col[2]; dane[o + 3] = 255;
    lvl.mmDirty = true;
  }
}

// ---------- Zbieranie: drzewa i rudy ----------
function obiektNaKafelku(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return null;
  const di = drzewaGrid[idx(tx, ty)];
  if (di) return drzewa[di - 1];
  const ri = rudyGrid[idx(tx, ty)];
  if (ri) return rudy[ri - 1];
  return null;
}

function najblizszyCel() {
  const ptx = Math.floor(gracz.x / T), pty = Math.floor((gracz.y + 6) / T);
  let best = null, bd = ZASIEG + 1;
  for (let ty = pty - 3; ty <= pty + 3; ty++) {
    for (let tx = ptx - 3; tx <= ptx + 3; tx++) {
      const o = obiektNaKafelku(tx, ty);
      if (!o || o.hp <= 0) continue;
      const d = Math.hypot(tx * T + T / 2 - gracz.x, ty * T + T / 2 - (gracz.y + 6));
      if (d < bd) { bd = d; best = o; }
    }
  }
  return best;
}

function wskazCel(wx, wy) {
  const cx = Math.floor(wx / T), cy = Math.floor(wy / T);
  let best = null;
  for (let ty = cy; ty <= cy + 3; ty++) {
    for (let tx = cx - 2; tx <= cx + 2; tx++) {
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
      const di = drzewaGrid[idx(tx, ty)];
      if (!di) continue;
      const t = drzewa[di - 1];
      if (t.hp <= 0) continue;
      const bx = tx * T + T / 2, by = (ty + 1) * T - 2;
      if (Math.abs(wx - bx) <= 24 && wy <= by + 2 && wy >= by - 64) {
        if (!best || ty > best.ty) best = t;
      }
    }
  }
  if (best) return best;
  if (cx >= 0 && cy >= 0 && cx < MAP_W && cy < MAP_H) {
    const ri = rudyGrid[idx(cx, cy)];
    if (ri && rudy[ri - 1].hp > 0) return rudy[ri - 1];
  }
  return null;
}

function akcja() {
  if (lvl.boss && !lvl.boss.dead && Math.hypot(lvl.boss.x - gracz.x, lvl.boss.y - gracz.y) < 140) { atakKursor(); return; }
  const st = najblizszaStacja(52);
  if (st) { otworzStacje(st); return; }
  const o = najblizszyCel();
  if (!o) { tekst("Nic do zebrania w pobliżu"); return; }
  const nar = potrzebneNarzedzie(o);
  if (!wezNarzedzie(nar)) { tekst(nar === "siekiera" ? "Potrzebujesz siekiery" : "Potrzebujesz kilofa"); return; }
  gracz.obiekt = o;
}

function kop(o) {
  const drzewo = o.typ === "drzewo";
  const idItem = drzewo ? "drewno" : o.item;
  if (!miejsceNa(idItem)) {
    tekst("Ekwipunek pełny!");
    gracz.obiekt = null;
    return;
  }
  const narz = inv[sel];
  o.hp -= narz ? mocNarz(narz) : 1;
  o.shake = 0.3;
  o.bar = 2.5;
  gracz.swing = 0.25;
  const cx = o.tx * T + T / 2, cy = o.ty * T + 12;
  const kolCz = drzewo ? "#8d5a2b" : "#9e9a94";
  for (let i = 0; i < 5; i++) {
    czastki.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 90, vy: -Math.random() * 70 - 20, life: 0.6, c: kolCz });
  }
  if (o.hp <= 0) {
    let n;
    if (drzewo) n = 3 + Math.floor(Math.random() * 2);
    else n = RUDY_DEF[o.rodzaj].hp >= 7 ? 1 + Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 2);
    const zostalo = dodaj(idItem, n);
    tekst("+" + (n - zostalo) + " " + ITEMY[idItem].nazwa, cx, cy - 34);
    if (zostalo > 0) tekst("Ekwipunek pełny!", cx, cy - 46);
    o.respawn = drzewo ? 45 : 60;
    gracz.obiekt = null;
    for (let i = 0; i < 12; i++) {
      if (drzewo) {
        czastki.push({ x: cx + (Math.random() - 0.5) * 30, y: cy - 30 - Math.random() * 20, vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 30, life: 0.9, c: Math.random() > 0.5 ? "#5fb83f" : "#337a21" });
      } else {
        const d = RUDY_DEF[o.rodzaj];
        czastki.push({ x: cx + (Math.random() - 0.5) * 20, y: cy - 8 - Math.random() * 12, vx: (Math.random() - 0.5) * 70, vy: -Math.random() * 50, life: 0.9, c: Math.random() > 0.5 ? d.kol : d.jas });
      }
    }
  }
}

// ---------- Interfejs ekwipunku ----------
const SL = 48, GAP = 6, KOLS = 8;
function slotXY(i) {
  const total = KOLS * SL + (KOLS - 1) * GAP;
  const x0 = Math.floor((W - total) / 2);
  if (i < 8) return { x: x0 + i * (SL + GAP), y: H - SL - 14 };
  const r = Math.floor((i - 8) / KOLS), c = (i - 8) % KOLS;
  return { x: x0 + c * (SL + GAP), y: H - SL - 14 - 26 - (2 - r) * (SL + GAP) };
}
function slotAt(mx, my) {
  const maks = invOtwarty ? SLOTY : 8;
  for (let i = 0; i < maks; i++) {
    const p = slotXY(i);
    if (mx >= p.x && mx <= p.x + SL && my >= p.y && my <= p.y + SL) return i;
  }
  return -1;
}
function eqGeom() {
  const total = KOLS * SL + (KOLS - 1) * GAP;
  const x0 = Math.floor((W - total) / 2);
  const pw = 84, ph = 214;
  return { px: x0 - 12 - pw - 8, py: H - 82 - ph, pw, ph };
}
function eqSlotXY(i) { const g = eqGeom(); return { x: g.px + 18, y: g.py + 30 + i * 56 }; }
function eqAt(mx, my) {
  if (!invOtwarty) return -1;
  for (let i = 0; i < 3; i++) {
    const p = eqSlotXY(i);
    if (mx >= p.x && mx <= p.x + SL && my >= p.y && my <= p.y + SL) return i;
  }
  return -1;
}
function wPanelu(mx, my) {
  if (!invOtwarty) return false;
  const total = KOLS * SL + (KOLS - 1) * GAP;
  const x0 = Math.floor((W - total) / 2);
  if (mx >= x0 - 12 && mx <= x0 + total + 12 && my >= H - 230 && my <= H - 82) return true;
  const g = eqGeom();
  return mx >= g.px && mx <= g.px + g.pw && my >= g.py && my <= g.py + g.ph;
}

function kliknijRef(ref) {
  if (!invOtwarty) { if (ref < 8) sel = ref; return; }
  if (dragFrom === -1) {
    if (getItem(ref)) dragFrom = ref;
    else if (ref < 8) sel = ref;
    return;
  }
  if (dragFrom !== ref) przenies(dragFrom, ref);
  dragFrom = -1;
}

function rysujSlotGeneric(x, y, it, obw, num) {
  ctx.fillStyle = "rgba(48,66,142,0.9)";
  ctx.fillRect(x, y, SL, SL);
  ctx.lineWidth = obw.w;
  ctx.strokeStyle = obw.c;
  ctx.strokeRect(x + 1, y + 1, SL - 2, SL - 2);
  if (it) {
    rysujIkone(it.id, x, y, SL);
    if (ITEMY[it.id].stos > 1) {
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "right";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#000";
      ctx.strokeText(it.n, x + SL - 4, y + SL - 5);
      ctx.fillStyle = "#fff";
      ctx.fillText(it.n, x + SL - 4, y + SL - 5);
    }
    if (it.buf) {
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffd700";
      ctx.fillText("★", x + SL - 4, y + 14);
    }
  }
  if (num) {
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillText(num, x + 4, y + 12);
  }
}
function rysujSlot(i) {
  const p = slotXY(i);
  const wyb = i === sel && i < 8;
  rysujSlotGeneric(p.x, p.y, inv[i], { w: wyb ? 3 : 2, c: i === dragFrom ? "#4fc3f7" : (wyb ? "#ffd700" : "#9aa8dd") }, i < 8 ? i + 1 : 0);
}
function rysujPanelZbroi() {
  const g = eqGeom();
  ctx.fillStyle = "rgba(15,15,25,0.8)";
  ctx.fillRect(g.px, g.py, g.pw, g.ph);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 15px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Zbroja", g.px + g.pw / 2, g.py + 20);
  for (let i = 0; i < 3; i++) {
    const p = eqSlotXY(i);
    rysujSlotGeneric(p.x, p.y, equip[i], { w: 2, c: dragFrom === 100 + i ? "#4fc3f7" : "#9aa8dd" }, 0);
    if (!equip[i]) {
      ctx.font = "10px Arial";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillText(EQ_NAZWY[i], p.x + SL / 2, p.y + SL / 2 + 3);
    }
  }
  ctx.fillStyle = "#9ad";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Obrona: " + lacznaObrona(), g.px + g.pw / 2, g.py + g.ph - 10);
}

function rysujMinimape() {
  if (lvl.typ !== "jaskinia") return;
  const s = 190 / lvl.w;
  const mw = lvl.w * s, mh = lvl.h * s;
  const x = W - mw - 18, y = 38;
  ctx.fillStyle = "rgba(8,8,14,0.85)";
  ctx.fillRect(x - 6, y - 28, mw + 12, mh + 34);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px Arial";
  ctx.textAlign = "left";
  ctx.fillText(lvl.nazwa, x, y - 10);
  ctx.fillStyle = "#14121a";
  ctx.fillRect(x, y, mw, mh);
  if (lvl.mmDirty) { lvl.mmx.putImageData(lvl.mmImg, 0, 0); lvl.mmDirty = false; }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lvl.mmc, x, y, mw, mh);
  const px = x + gracz.x / T * s, py = y + (gracz.y + 6) / T * s;
  ctx.fillStyle = (Math.floor(czas * 3) % 2) ? "#ff5252" : "#ffffff";
  ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
}

function rysujUI() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const total = KOLS * SL + (KOLS - 1) * GAP;
  const x0 = Math.floor((W - total) / 2);

  if (!TOUCH) {
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(10, 10, 500, 184);
  ctx.fillStyle = "#fff";
  ctx.font = "14px Arial";
  ctx.textAlign = "left";
  ctx.fillText("WASD / strzałki – ruch, LPM – atak w stronę kursora (trzymaj = seria)", 20, 30);
  ctx.fillText("1-8 – wybór slotu, I – ekwipunek i zbroja, kółko myszy – zoom", 20, 50);
  ctx.fillText("Zbroja: kliknij przedmiot, potem miejsce w panelu, albo PPM", 20, 70);
  ctx.fillText("Siekiera: klik w drzewo albo Spacja / F przy drzewie", 20, 90);
  ctx.fillText("Kilof: klik w rudę albo Spacja / F przy rudzie", 20, 110);
  ctx.fillText("Sklep, piec, odlewnia, kowadło, kamień: klik albo Spacja / F", 20, 130);
  ctx.fillText("Jaskinie: schody ▼ strzeże boss – celuj myszką, LPM = atak", 20, 150);
  ctx.fillText("Port: wejdź na koniec pomostu, by popłynąć na inną wyspę", 20, 170);
  ctx.fillText("Rudy: piec (3→1 płynna) → odlewnia (2→1 sztabka) → kowadło", 20, 190);
  }
  if (TOUCH && pomocOtw) {
    const L = ["Lewy joystick – ruch", "⚔ – atak (celuje w bossa)", "✋ – zbieraj / otwórz sklep, piec, kowadło", "Dotknij drzewa lub rudy, by iść i zbierać", "🎒 – ekwipunek: dotknij przedmiot, potem miejsce", "Przytrzymaj przedmiot – załóż / zdejmij", "Dwa palce – zoom   ·   ? – ukryj pomoc"];
    const pw = Math.min(380, W - 120);
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(56, 10, pw, 16 + L.length * 20);
    ctx.fillStyle = "#fff"; ctx.font = "13px Arial"; ctx.textAlign = "left";
    L.forEach((t, i) => ctx.fillText(t, 66, 31 + i * 20));
  }

  ctx.font = "bold 13px Arial";
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  const nz = lvl.nazwa;
  const nw = ctx.measureText(nz).width + 20;
  if (lvl.typ === "swiat") {
    ctx.fillRect(W - nw - 10, 10, nw, 26);
    ctx.fillStyle = "#fff";
    ctx.fillText(nz, W - 20, 28);
  }

  if (invOtwarty) {
    ctx.fillStyle = "rgba(15,15,25,0.8)";
    ctx.fillRect(x0 - 12, H - 230, total + 24, 148);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Ekwipunek", x0, H - 210);
    ctx.font = "12px Arial";
    ctx.fillStyle = "#bbb";
    ctx.textAlign = "right";
    ctx.fillText("Kliknij przedmiot, potem miejsce docelowe", x0 + total, H - 210);
    for (let i = 8; i < SLOTY; i++) rysujSlot(i);
    rysujPanelZbroi();
  }

  ctx.fillStyle = "rgba(15,15,25,0.8)";
  ctx.fillRect(x0 - 8, H - SL - 22, total + 16, SL + 16);
  for (let i = 0; i < 8; i++) rysujSlot(i);

  const obr = lacznaObrona();
  if (obr > 0) {
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "left";
    ctx.fillStyle = "#9ad";
    ctx.fillText("Obrona: " + obr, x0 - 8, H - SL - 28);
  }

  const s = slotAt(mysz.x, mysz.y);
  const q = eqAt(mysz.x, mysz.y);
  let hItem = null, hSlot = null;
  if (s >= 0 && inv[s]) { hItem = inv[s]; hSlot = slotXY(s); }
  else if (q >= 0 && equip[q]) { hItem = equip[q]; hSlot = eqSlotXY(q); }
  if (hItem) {
    const linie = [nazwaPrzedmiotu(hItem)];
    const sl = statLinia(hItem);
    if (sl) linie.push(sl);
    ctx.font = "bold 13px Arial";
    let w = 0;
    linie.forEach(l => { w = Math.max(w, ctx.measureText(l).width); });
    w += 16;
    const hh = linie.length * 18 + 8;
    const tx = Math.min(W - w - 4, Math.max(4, hSlot.x + SL / 2 - w / 2));
    const ty = hSlot.y - hh - 6;
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(tx, ty, w, hh);
    ctx.textAlign = "left";
    linie.forEach((l, i) => {
      ctx.fillStyle = i === 0 ? "#fff" : "#9ad";
      ctx.fillText(l, tx + 8, ty + 18 + i * 18);
    });
  }

  rysujMinimape();
  if (sklepOtwarty) rysujSklepUI();
  if (stacja) rysujStacjeUI();
  if (statekOtwarty) rysujStatekUI();
}

// ---------- Sterowanie ----------
const klawisze = {};
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  klawisze[k] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (!e.repeat) akcja();
  }
  if (k === "f" && !e.repeat) akcja();
  if (e.key === "Escape") {
    zamknijStacje();
    if (statekOtwarty) { statekOtwarty = false; statekBlok = true; }
  }
  if ((k === "i" || k === "e") && !e.repeat) { invOtwarty = !invOtwarty; dragFrom = -1; }
  if (k.length === 1 && k >= "1" && k <= "8") sel = parseInt(k) - 1;
  if (e.key === "+" || e.key === "=") kamera.celZoom = Math.min(5, kamera.celZoom * 1.2);
  if (e.key === "-") kamera.celZoom = Math.max(0.4, kamera.celZoom / 1.2);
});
document.addEventListener("keyup", e => { klawisze[e.key.toLowerCase()] = false; });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (stacja) {
    const u = ukladStacji();
    if (u && wRect(u.r, (e.clientX / US), (e.clientY / US))) {
      stacja.scroll = Math.max(0, Math.min(u.scrollMax, stacja.scroll + (e.deltaY > 0 ? 1 : -1)));
      return;
    }
  }
  const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  kamera.celZoom = Math.max(0.4, Math.min(5, kamera.celZoom * f));
}, { passive: false });

canvas.addEventListener("pointermove", e => { mysz.x = (e.clientX / US); mysz.y = (e.clientY / US); });

canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  const q = eqAt((e.clientX / US), (e.clientY / US));
  if (q >= 0) { zdejmij(q); return; }
  const s = slotAt((e.clientX / US), (e.clientY / US));
  if (s >= 0) autoZaloz(s);
});

canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  mysz.x = (e.clientX / US); mysz.y = (e.clientY / US);

  if (statekOtwarty && obsluzKlikStatku((e.clientX / US), (e.clientY / US))) return;
  if (sklepOtwarty && obsluzKlikSklepu((e.clientX / US), (e.clientY / US))) return;
  if (stacja && obsluzKlikStacji((e.clientX / US), (e.clientY / US))) return;

  const q = eqAt((e.clientX / US), (e.clientY / US));
  if (q >= 0) { kliknijRef(100 + q); return; }
  const s = slotAt((e.clientX / US), (e.clientY / US));
  if (s >= 0) { kliknijRef(s); return; }
  if (wPanelu((e.clientX / US), (e.clientY / US))) return;
  const total = KOLS * SL + (KOLS - 1) * GAP;
  const x0 = Math.floor((W - total) / 2);
  if ((e.clientX / US) >= x0 - 8 && (e.clientX / US) <= x0 + total + 8 && (e.clientY / US) >= H - SL - 22) return;

  const wx = ((e.clientX / US) - W / 2) / kamera.zoom + kamera.x;
  const wy = ((e.clientY / US) - H / 2) / kamera.zoom + kamera.y;

  gracz.celBoss = false;
  const st = wskazStacje(wx, wy);
  if (st) {
    gracz.obiekt = null;
    if (odlegloscDoObiektu(st) < 52) {
      otworzStacje(st);
    } else {
      gracz.cel = { x: st.px !== undefined ? st.px : (st.tx + st.w / 2) * T, y: (st.ty + st.h) * T + 10 };
      gracz.doStacji = st;
    }
    return;
  }

  const o = wskazCel(wx, wy);
  if (o) {
    gracz.doStacji = null;
    const nar = potrzebneNarzedzie(o);
    if (!wezNarzedzie(nar)) { tekst(nar === "siekiera" ? "Potrzebujesz siekiery" : "Potrzebujesz kilofa"); return; }
    gracz.obiekt = o;
    gracz.cel = null;
    return;
  }
  gracz.obiekt = null;
  gracz.doStacji = null;
  gracz.cel = null;
  gracz.atakuje = true;
});

// ---------- Aktualizacja ----------
function aktualizuj(dt) {
  czas += dt;
  aktualizujWalke(dt);
  if (gracz.swing > 0) gracz.swing = Math.max(0, gracz.swing - dt);
  if (fade > 0) fade = Math.max(0, fade - dt * 2.2);
  if (portalCd > 0) portalCd -= dt;

  for (const lista of [drzewa, rudy]) {
    for (const t of lista) {
      if (t.shake > 0) t.shake -= dt;
      if (t.bar > 0) t.bar -= dt;
      if (t.hp <= 0) {
        t.respawn -= dt;
        if (t.respawn <= 0) {
          const d = Math.hypot(t.tx * T + T / 2 - gracz.x, t.ty * T + T / 2 - (gracz.y + 6));
          if (d > 48) t.hp = t.maxhp; else t.respawn = 1;
        }
      }
    }
  }
  for (let i = czastki.length - 1; i >= 0; i--) {
    const p = czastki[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt; p.life -= dt;
    if (p.life <= 0) czastki.splice(i, 1);
  }
  for (let i = teksty.length - 1; i >= 0; i--) {
    const t = teksty[i];
    t.y -= 14 * dt; t.life -= dt;
    if (t.life <= 0) teksty.splice(i, 1);
  }

  if (gracz.doStacji && odlegloscDoObiektu(gracz.doStacji) < 52) {
    otworzStacje(gracz.doStacji);
  }
  if (otwartyObj && odlegloscDoObiektu(otwartyObj) > 110) zamknijStacje();

  let dx = 0, dy = 0;
  if (klawisze["arrowleft"]  || klawisze["a"]) dx -= 1;
  if (klawisze["arrowright"] || klawisze["d"]) dx += 1;
  if (klawisze["arrowup"]    || klawisze["w"]) dy -= 1;
  if (klawisze["arrowdown"]  || klawisze["s"]) dy += 1;

  if (dx || dy) gracz.celBoss = false;
  let pracuje = false;
  if (dx || dy) {
    gracz.cel = null;
    gracz.obiekt = null;
    gracz.doStacji = null;
  } else if (gracz.celBoss && lvl.boss && !lvl.boss.dead) {
    const bb = lvl.boss, rx = bb.x - gracz.x, ry = bb.y - gracz.y, dd = Math.hypot(rx, ry) || 1;
    gracz.kierunek = rx >= 0 ? 1 : -1;
    if (dd > zasiegAtaku(bb) - 8) { dx = rx / dd; dy = ry / dd; } else atakBossa();
  } else if (gracz.obiekt) {
    const o = gracz.obiekt;
    if (o.hp <= 0 || typTrz() !== potrzebneNarzedzie(o)) {
      gracz.obiekt = null;
    } else {
      const rx = o.tx * T + T / 2 - gracz.x;
      const ry = o.ty * T + T / 2 - (gracz.y + 6);
      const d = Math.hypot(rx, ry);
      if (d <= ZASIEG) {
        pracuje = true;
        gracz.kierunek = rx >= 0 ? 1 : -1;
      } else {
        dx = rx / d; dy = ry / d;
      }
    }
  } else if (gracz.cel) {
    const rx = gracz.cel.x - gracz.x;
    const ry = gracz.cel.y - gracz.y;
    const d = Math.hypot(rx, ry);
    if (d < 4) { gracz.cel = null; }
    else { dx = rx / d; dy = ry / d; }
  }

  if (pracuje) {
    gracz.krok = 0;
    gracz.chopT -= dt;
    if (gracz.chopT <= 0 && gracz.obiekt) {
      kop(gracz.obiekt);
      gracz.chopT = 0.55 / predkoscNarz(inv[sel]);
    }
  } else {
    gracz.chopT = 0.1;
  }

  const dl = Math.hypot(dx, dy);
  if (dl > 0 && !pracuje) {
    dx /= dl; dy /= dl;
    let ruszyl = false;
    const nx = gracz.x + dx * gracz.v * dt;
    if (wolne(nx, gracz.y)) { gracz.x = nx; ruszyl = true; }
    const ny = gracz.y + dy * gracz.v * dt;
    if (wolne(gracz.x, ny)) { gracz.y = ny; ruszyl = true; }

    if (!ruszyl) {
      if (gracz.cel) gracz.cel = null;
      if (gracz.obiekt) gracz.obiekt = null;
      gracz.doStacji = null;
    }
    if (ruszyl) {
      gracz.krok += dt * 10;
      if (dx !== 0) gracz.kierunek = dx > 0 ? 1 : -1;
    } else {
      gracz.krok = 0;
    }
  } else if (!pracuje) {
    gracz.krok = 0;
  }

  gracz.x = Math.max(T, Math.min(WORLD_W - T, gracz.x));
  gracz.y = Math.max(T, Math.min(WORLD_H - T, gracz.y));

  const pi = Math.floor((gracz.y + 6) / T) * MAP_W + Math.floor(gracz.x / T);
  const p = lvl.portale[pi];
  if (p && p.statek) {
    if (!statekOtwarty && !statekBlok && portalCd <= 0) {
      statekOtwarty = true;
      gracz.cel = null; gracz.obiekt = null; gracz.doStacji = null;
    }
  } else {
    statekOtwarty = false;
    statekBlok = false;
    if (p && p.boss && lvl.boss && !lvl.boss.dead) {
      if (portalCd <= 0) { tekst('Pokonaj bossa: ' + lvl.boss.def.n + '!'); portalCd = 1.2; }
    } else if (p && p.fn && portalCd <= 0) {
      const dest = p.fn();
      wejdzDo(dest.cel, dest.x, dest.y);
    }
  }

  odkrywaj();

  const ptx = Math.floor(gracz.x / T), pty = Math.floor((gracz.y + 6) / T);
  const wSrodku = lvl.id === "glowna" && ptx > CX0 && ptx < CX0 + CW - 1 && pty > CY0 && pty < CY0 + CH - 1;
  const plynnosc = 1 - Math.pow(0.001, dt);
  dachAlfa += ((wSrodku ? 0 : 1) - dachAlfa) * plynnosc;
  ciemnosc += ((lvl.typ === "jaskinia" ? 1 : 0) - ciemnosc) * plynnosc;

  kamera.x += (gracz.x - kamera.x) * plynnosc;
  kamera.y += (gracz.y - kamera.y) * plynnosc;
  kamera.zoom += (kamera.celZoom - kamera.zoom) * plynnosc;
}

// ---------- Rysowanie drzew i rud ----------
function rysujDrzewo(t) {
  const bx = t.tx * T + T / 2, by = (t.ty + 1) * T - 2;

  if (t.hp <= 0) {
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath(); ctx.ellipse(bx + 2, by, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(PIEN_SPR, bx - 26, by - 66, 52, 68);
    return;
  }

  const k = Math.sin(czas * 1.5 + t.tx * 0.7 + t.ty) * 0.012 + (t.shake > 0 ? Math.sin(t.shake * 60) * 0.05 : 0);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(bx + 4, by, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(bx, by);
  ctx.transform(1, 0, k, 1, 0, 0);
  ctx.drawImage(DRZEWA_SPR[Math.min(2, Math.floor(t.v * 3))], -26, -66, 52, 68);
  ctx.restore();

  if (t.bar > 0 && t.hp < t.maxhp) {
    const w = 26;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(bx - w / 2 - 1, by - 76, w + 2, 6);
    ctx.fillStyle = "#e53935";
    ctx.fillRect(bx - w / 2, by - 75, w * Math.max(0, t.hp / t.maxhp), 4);
  }
}

function rysujRude(o) {
  const d = RUDY_DEF[o.rodzaj];
  const x = o.tx * T, y = o.ty * T;
  const v = Math.floor(hash(o.tx, o.ty, 9) * 3);

  if (o.hp <= 0) {
    ctx.fillStyle = "#6a6a72";
    ctx.fillRect(x + 6, y + 22, 6, 4);
    ctx.fillRect(x + 15, y + 20, 7, 5);
    ctx.fillRect(x + 22, y + 24, 5, 3);
    ctx.fillStyle = "#85858d";
    ctx.fillRect(x + 7, y + 22, 3, 2);
    return;
  }

  const sx = o.shake > 0 ? Math.round(Math.sin(o.shake * 60) * 1.5) : 0;
  dt(rudaBlok(o.rodzaj, v), x + sx, y);
  if (d.hp >= 7) {
    for (let i = 0; i < 3; i++) {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(czas * 3 + i * 2 + o.tx));
      ctx.fillStyle = "rgba(255,255,255," + a * 0.8 + ")";
      ctx.fillRect(x + 4 + hash(o.tx, o.ty, 120 + i) * 22, y + 4 + hash(o.tx, o.ty, 125 + i) * 22, 2, 2);
    }
  }

  if (o.bar > 0 && o.hp < o.maxhp) {
    const w = 24;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(x + T / 2 - w / 2 - 1, y - 8, w + 2, 6);
    ctx.fillStyle = "#e53935";
    ctx.fillRect(x + T / 2 - w / 2, y - 7, w * Math.max(0, o.hp / o.maxhp), 4);
  }
}

function rysujObiekt(o) {
  if (o.typ === "drzewo") rysujDrzewo(o); else rysujRude(o);

function rysujPrzedmiot(o) {
  const x = o.tx * T, y = o.ty * T, w = o.w * T, h = o.h * T;
  if (o.typ === "sklep") rysujSklep(x, y, w, h);
  else if (o.typ === "piec") rysujPiec(x, y, w, h);
  else if (o.typ === "odlewnia") rysujOdlewnie(x, y, w, h);
  else if (o.typ === "kamien") rysujKamien(x, y, w, h);
  else if (o.typ === "kowadlo") rysujKowadlo(x, y, w, h);
  else rysujStol(x, y, w, h);
  podpis(o.nazwa, x + w / 2, y - ((o.typ === "piec" || o.typ === "odlewnia") ? 38 : 4));
}
